# 나의 하루 안드로이드 설치 파일(APK) 자동 생성
# android/ 폴더가 바뀌거나 Actions 탭에서 「Run workflow」를 누르면 빌드 → Releases에 mylife.apk 업로드
# (선택) 저장소 Settings → Secrets → Actions 에 KEYSTORE_B64, KEYSTORE_PASS 를 넣으면 고정 서명키 사용
name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          else
            P=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -alias mylife -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$P" -keypass "$P" -dname "CN=MyLife, O=MyLife, C=KR"
            echo "::add-mask::$P"
            echo "KS_PASS=$P" >> "$GITHUB_ENV"
          fi
          echo "KS_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: APK 빌드
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: 서명 지문(SHA-256) 출력
        run: |
          keytool -list -v -keystore "$KS_PATH" -alias mylife -storepass "$KS_PASS" | grep -i "SHA256" | tee fingerprint.txt
          cp android/app/build/outputs/apk/release/app-release.apk mylife.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: 나의 하루 안드로이드 앱
          make_latest: true
          overwrite_files: true
          body: |
            ## 📲 나의 하루 — 안드로이드 설치 파일
            1. 아래 **mylife.apk** 를 폰에서 눌러 내려받기
            2. 「출처를 알 수 없는 앱」 경고 → 설정 → **이 출처 허용** → 뒤로 → **설치**
            3. 앱을 열면 **연결 마법사**가 구글 연결을 순서대로 안내해요
            (앱 내용은 웹에서 자동 업데이트되므로 설치 파일을 다시 받을 필요가 거의 없어요)
          files: mylife.apk
