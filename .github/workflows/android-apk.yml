# 나의 하루 — 독립형 안드로이드 APK 빌드 (앱 화면 내장, 사용자 본인 서버와만 통신)
# 결과 APK는 어디에도 의존하지 않습니다. 이 저장소는 '빌드 기계'로만 쓰입니다.
name: Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'life/**', 'tools/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: 서명 키 준비
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
          else
            P=$(openssl rand -hex 16)
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" -alias mylife -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$P" -keypass "$P" -dname "CN=MyLife, O=MyLife, C=KR"
            echo "::add-mask::$P"
            echo "KS_PASS=$P" >> "$GITHUB_ENV"
          fi
          echo "KS_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: 앱 화면·서버 코드 만들기
        run: python3 tools/build_standalone.py
      - name: APK 빌드
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: 서명 지문(SHA-256) 출력
        run: |
          keytool -list -v -keystore "$KS_PATH" -alias mylife -storepass "$KS_PASS" | grep -i "SHA256" | tee fingerprint.txt
          cp android/app/build/outputs/apk/release/app-release.apk mylife.apk
          cp "dist/1_나의하루_서버코드.gs" server.gs
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: 나의 하루 안드로이드 앱
          make_latest: true
          overwrite_files: true
          body: |
            ## 📲 나의 하루 — 안드로이드 설치 파일
            1. 아래 **mylife.apk** 를 폰에서 눌러 내려받기
            2. 「출처를 알 수 없는 앱」 경고 → 설정 → **이 출처 허용** → 뒤로 → **설치**
            3. 앱을 열면 **연결 마법사**가 「내 서버 만들기」를 순서대로 안내해요 (server.gs = 서버 코드)
            모든 데이터는 사용자 본인의 구글 계정 안에만 저장됩니다.
          files: |
            mylife.apk
            server.gs
