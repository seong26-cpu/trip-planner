# 임시 실측: 실제 앱(index.html)을 헤드리스 크롬으로 열어 도시 팩 만들기를 여러 도시로 시험 — 확인 후 브랜치째 삭제
name: tmp-probe-pack
on:
  push:
    branches: [tmp-probe-pack]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium >/dev/null
      - run: sed -i 's/async function autoPackFor(/window.__bcp=buildCityPack;async function autoPackFor(/' index.html && grep -c '__bcp' index.html
      - run: (python3 -m http.server 8080 >/dev/null 2>&1 &) && sleep 2
      - name: build packs
        run: node .github/probe-pack.mjs
