  if(!packFor(trip)){try{await autoPackFor(trip)}catch(e){trip.recStatus=`"${trip.city||city}" 자동 팩을 만들지 못했어요: ${e.message} 숙소·맛집 검색 링크는 쓸 수 있어요. 인터넷 연결 후 더보기 → 도시 팩에서 "자동으로 만들기"를 다시 눌러주세요.`;return 0}}
  const pk=packFor(trip);
  if(!pk){trip.recStatus=`"${city}"는 아직 검증 팩이 없어 추천 칸을 비워뒀어요. 숙소·맛집 검색 링크는 쓸 수 있어요. 제공 중인 팩: ${Object.values(PACKS).map(p=>p.city).join("·")}. 새 도시 팩은 Claude 채팅에서 "${trip.city||city} 팩 만들어줘"라고 요청하면 추가돼요.${packIndexErr?" ("+packIndexErr+")":""}`;return 0}
  if(pk.cur){trip.cur=pk.cur}if(pk.lang)trip.lang=pk.lang;if(pk.to&&!trip.to)trip.to=pk.to;
  if(pk.rateHint&&(!trip.rate||trip.rateFrom===pk.id)){trip.rate=pk.rateHint.value;trip.rateFrom=pk.id}
  pk.places.forEach((p,i)=>S.places.push(Object.assign({id:"rec-"+p.pid,rec:true,visited:false,query:p.nameEn+" "+pk.cityEn,createdAt:i},p)));
  pk.hotels.forEach((h,i)=>S.hotels.push(Object.assign({id:"htl-"+pk.id+"-"+i,rank:i+1},h)));
  if(pk.auto){const nf=pk.places.filter(p=>p.kind==="맛집").length;if(PP.on){ppSet("apply","ok",`장소 ${pk.places.length} · 숙소 ${pk.hotels.length}`);ppFinish(true,`추천 장소 ${pk.places.length-nf}곳·맛집 ${nf}곳·숙소 ${pk.hotels.length}곳을 반영했어요.${pk.warn&&pk.warn.length?" 일부 실패: "+pk.warn.join(" / "):""}`)}trip.recStatus=`${pk.city} 자동 팩을 반영했어요(${pk.version}): 명소 ${pk.places.length-nf}곳·맛집 ${nf}곳·숙소 ${pk.hotels.length}곳. OpenStreetMap·Wikidata·Wikivoyage 공개 데이터라 입장료·숙소 가격은 없어요. 인기순은 위키 문서 수 기준이에요.${pk.warn&&pk.warn.length?" (일부 실패: "+pk.warn.join(" / ")+")":""}${trip.rateFrom===pk.id&&pk.rateHint?" 환율 칸에 참고 환율 "+pk.rateHint.value+"을 넣었어요("+pk.rateHint.note+").":""}`;return pk.places.length}
  trip.recStatus=`${pk.city} 검증 팩을 반영했어요: 추천 ${pk.places.length}곳, 숙소 ${pk.hotels.length}곳 (${pk.version||"2026년 10월"} 웹검색 기준, 출처 표시).${trip.rateFrom===pk.id&&pk.rateHint?" 환율 칸에 참고 환율 "+pk.rateHint.value+"을 넣었어요("+pk.rateHint.note+"). 출발 전 다시 확인하세요.":""}`;
  return pk.places.length;

function llField(p){return `<div class="llrow"><label class="f">위치 "위도, 경도" 또는 구글 지도 링크 (비워두면 이름으로 자동 찾기)<input id="${p}-ll" name="ll" placeholder="34.6873, 135.5262"></label><button type="button" class="btn sm" data-act="geoFind" data-form="${p}">📍 찾기</button></div><div class="geo-res" id="${p}-geo"></div>`}
const GEO={last:0,cache:{},q:Promise.resolve()};
function geoBias(){const pts=[...S.places,...S.items].filter(hasLL);if(!pts.length)return"";const la=pts.reduce((a,p)=>a+p.lat,0)/pts.length,ln=pts.reduce((a,p)=>a+p.lng,0)/pts.length;return `&viewbox=${(ln-.7).toFixed(3)},${(la+.7).toFixed(3)},${(ln+.7).toFixed(3)},${(la-.7).toFixed(3)}`}
function geocode(q,limit){q=String(q||"").trim();if(!q)return Promise.resolve([]);const k=q+"|"+(limit||5);if(GEO.cache[k])return Promise.resolve(GEO.cache[k]);
  const run=async()=>{const wait=GEO.last+1100-Date.now();if(wait>0)await new Promise(r=>setTimeout(r,wait));GEO.last=Date.now();
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=${limit||5}&accept-language=ko,en&q=${enc(q)}${geoBias()}`);if(!r.ok)throw new Error("geo "+r.status);
    const a=(await r.json()).map(x=>({name:x.name||String(x.display_name||"").split(",")[0],addr:x.display_name||"",lat:+x.lat,lng:+x.lon})).filter(hasLL);GEO.cache[k]=a;return a};
  const p=GEO.q.then(run,run);GEO.q=p.catch(()=>{});return p}
const norm=v=>String(v||"").toLowerCase().replace(/\s+/g,"");
function findLL(name){const n=norm(name);if(!n)return null;const all=[...S.places,...S.items.map(i=>({name:i.title,lat:i.lat,lng:i.lng}))].filter(hasLL);
  const hit=all.find(p=>norm(p.name)===n||norm(p.nameEn)===n)||(n.length>=3?all.find(p=>norm(p.name).includes(n)||n.includes(norm(p.name))&&norm(p.name).length>=3):null);return hit?{lat:hit.lat,lng:hit.lng,how:"저장된 장소 «"+hit.name+"» 위치"}:null}
async function geocodeBest(name,query){const city=(T().cityEn||T().city||"").trim();const qs=[];if(query)qs.push(query);if(city)qs.push(name+" "+city);qs.push(name);
  for(const q of [...new Set(qs)]){const a=await geocode(q,1);if(a.length)return Object.assign({},a[0],{how:"지도 검색: "+a[0].addr.split(",").slice(0,3).join(",")})}return null}

  if(f.id==="ckForm"){addDoc("checklist",{cat:d.cat,text:d.text,done:false});return}
  if(f.id==="bkForm"){const wasEdit=!!EDIT;addDoc("bucket",{cat:bkCat(d.cat),name:d.name,area:d.area,cost:Number(d.cost)||0,note:d.note,done:false});if(!wasEdit)toast("🪣 버킷리스트에 담았어요");return}
  if(f.id==="noteForm"){const body=f.querySelector("#nf-body").value;const title=(d.title||body.trim().split("\n")[0]||"메모").slice(0,40);if(!body.trim()&&!d.title){toast("내용을 적어주세요");return}const wasEdit=!!EDIT;addDoc("notes",{title,body,tag:d.tag,pin:!!f.querySelector("#nf-pin").checked,updatedAt:Date.now()});if(!wasEdit)toast("📝 메모를 저장했어요");return}
  if(f.id==="memForm"){await saveMemory(f);return}
});

function shrink(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const m=1280,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.8))};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("decode"))};img.src=url})}
async function saveMemory(f){
  const btn=$("#mf-btn"),msg=$("#mf-msg"),files=[...$("#mf-files").files],d=formData(f);
  if(!d.text&&!files.length){msg.textContent="글이나 사진을 하나 이상 넣어주세요.";return}
  if(files.length&&!idb){msg.textContent="이 브라우저는 사진 저장을 지원하지 않아요(개인정보 보호 모드 등). 글만 저장할게요."}
  btn.disabled=true;const ids=[];
  try{if(idb)for(let i=0;i<files.length;i++){msg.textContent=`사진 저장 중 ${i+1}/${files.length}`;const data=await shrink(files[i]);const pid="ph"+uid();const ok=await putPhoto(pid,data);if(ok){PH[pid]=data;ids.push(pid)}}
    addDoc("memories",{date:d.date,place:d.place,text:d.text,photos:ids});f.reset();msg.textContent="";toast(Sync.user?"추억을 저장했어요 · 계정에 올리는 중":"추억을 저장했어요")}
  catch(err){msg.textContent="사진을 저장하지 못했어요. JPG·PNG인지 확인하세요.";if(ids.length||d.text)addDoc("memories",{date:d.date,place:d.place,text:d.text,photos:ids})}
  finally{btn.disabled=false}
}

/* ---------- boot ---------- */
try{const saved=localStorage.getItem("tp-tab");if(saved&&(saved==="more"||TABS.some(([k])=>k===saved)))tab=saved}catch(_){}
if(location.hash&&(location.hash==="#more"||TABS.some(([k])=>k===location.hash.slice(1))))tab=location.hash.slice(1);
loadLocal();
render();
openIDB().then(async()=>{await loadPhotos();render();Sync.init()});
})();

</script>
