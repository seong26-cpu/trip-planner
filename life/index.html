<html lang="ko">

<style>
:root{--bg:#FFF3E6;--card:#fff;--ink:#2B1734;--sub:#6E4B5E;--line:#F6DCC8;--brand:#C2410C;--brand2:#FFE4CF;--sun:#FF6A3D;--gold:#FFC24B;--warn:#9A3412;--warnbg:#FFEFC2;--bad:#B91C1C;--r:22px;--onbrand:#2B1734;--glow:0 14px 30px -22px rgba(214,72,40,.7)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:20px;margin:0;flex:1}
#sync{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--card);cursor:pointer}
main{padding:4px 16px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav.tabs button{flex:1;border:0;background:none;color:var(--sub);padding:8px 0 10px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button .i{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--brand);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.card h2 .sp{flex:1}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.item:first-of-type{border-top:0}
.item .b{flex:1;min-width:0}
.item .t{font-weight:600;word-break:break-all}
.item .d{color:var(--sub);font-size:13px;white-space:pre-wrap;word-break:break-all}
button,.btn{font:inherit;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;justify-content:center}
button.p,.btn.p{background:var(--brand);border-color:var(--brand);color:var(--onbrand);font-weight:600}
button.s{padding:5px 10px;font-size:13px;border-radius:10px}
button.x{border:0;background:none;color:var(--sub);padding:4px 6px}
input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;color:var(--sub);display:block;margin:8px 0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip{white-space:nowrap;border-radius:99px;padding:6px 12px;font-size:13px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.chip.on{background:var(--brand2);border-color:var(--brand);color:var(--brand);font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--brand2);color:var(--brand);margin-right:4px}
.tag.w{background:var(--warnbg);color:var(--warn)}
.big{font-size:28px;font-weight:800}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--brand);color:var(--onbrand);font-size:28px;border:0;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:8}
dialog{border:0;border-radius:20px;padding:0;width:min(560px,94vw);background:var(--card);color:var(--ink);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{padding:18px}

.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:6px}
.bars div{flex:1;background:var(--brand2);border-radius:6px 6px 0 0;position:relative;min-height:2px}
.bars div.on{background:var(--brand)}
.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--sub)}
.notice{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#1c1f1e;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;max-width:90vw}
.steps li{margin:6px 0}
code{background:var(--brand2);padding:1px 5px;border-radius:6px;font-size:13px}
.thumb{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:8px}
.hide{display:none!important}
.sec{display:none}.sec.on{display:block}
.empty{color:var(--sub);text-align:center;padding:14px;font-size:14px}
:root[data-topic=fit]{--brand:#C2410C;--sun:#FF6A3D}
:root[data-topic=cook]{--brand:#B45309;--sun:#FFA53D}
:root[data-topic=food]{--brand:#BE123C;--sun:#FF7A6B;--brand2:#FFE1DD}

.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}

.tcard img{width:100%;height:96px;object-fit:cover;display:block}
.tcard div{padding:10px 12px}.tcard b{display:block;font-size:16px}.tcard span{font-size:12px;color:var(--sub)}
.banner{display:block;width:100%;height:150px;object-fit:cover;border-radius:18px;margin:10px 0 6px}
.big2{font-size:24px;margin:8px 0 6px;letter-spacing:-.4px}

.hero img{display:block;width:100%;height:170px;object-fit:cover;border-radius:18px;margin-top:12px}

.stats3 b{display:block;font-size:22px;color:var(--brand)}.stats3 span{font-size:12px;color:var(--sub)}
.rail{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px}

.th{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:0 0 auto}

.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:8px 0 12px;border-radius:12px;overflow:hidden}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}

.pcard img{display:block;width:100%;height:110px;object-fit:cover}.pcard .pb{padding:10px 12px 12px}
.pcard .t{font-weight:700;word-break:break-all}.pcard .d{font-size:12px;color:var(--sub);white-space:pre-line}
.pcard .st{margin-top:4px;color:var(--brand);font-size:13px;letter-spacing:1px}.pcard .st span{color:var(--sub);letter-spacing:0;font-size:12px}
.seg{display:flex;background:var(--brand2);border-radius:99px;padding:3px}

.seg span.on{background:var(--card);color:var(--ink);font-weight:700}

.drow{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;justify-content:space-between}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center}
.cell span,.cell small{display:block;font-size:12px;color:var(--sub)}.cell b{font-size:18px;color:var(--brand)}
.pill{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--card);cursor:pointer;white-space:nowrap}#acct:empty{display:none}#acct.go{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.hero{background:linear-gradient(135deg,var(--brand2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:10px 0}.hero b{font-size:16px}.hero p{margin:6px 0 12px;color:var(--sub);font-size:13px}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.excard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:block;color:var(--ink)}
.excard img{display:block;width:100%;height:104px;object-fit:cover;background:#ddd}.excard div{padding:8px 10px 10px}.excard b{display:block;font-size:14px;line-height:1.3}.excard span{font-size:11px;color:var(--sub)}
.flip{position:relative;width:100%;aspect-ratio:3/2;border-radius:14px;overflow:hidden;background:#ddd}
.flip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.flip img.b{animation:flip 2.4s steps(1) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
.flip i{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-style:normal;font-size:11px;padding:2px 8px;border-radius:99px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.pair figure{margin:0;font-size:11px;color:var(--sub);text-align:center}.pair img{width:100%;border-radius:10px;display:block}
ol.num{padding-left:0;list-style:none;counter-reset:n;margin:8px 0}ol.num li{counter-increment:n;position:relative;padding:8px 0 8px 36px;border-top:1px solid var(--line)}ol.num li:first-child{border-top:0}
ol.num li::before{content:counter(n);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--onbrand);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.dimg{width:100%;height:170px;object-fit:cover;display:block;background:var(--brand2)}
.rcp{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.rcp:first-child{border-top:0}
.rcp img{width:68px;height:68px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:var(--brand2)}
.ok{color:#15803d}.no{color:var(--bad)}
.tile.my{background:var(--brand2);color:var(--brand)}.tile.add{color:var(--sub);border:0}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.kind label{margin:0;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:12px;border:2px solid var(--line);font-weight:700;color:var(--sub);cursor:pointer;font-size:15px}
.kind input{display:none}.kind label.on.pub{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}.kind label.on.pri{border-color:#db2777;background:#fdf2f8;color:#be185d}
.tag.pub{background:#dbeafe;color:#1d4ed8}.tag.pri{background:#fce7f3;color:#be185d}.tag.unk{background:var(--line);color:var(--sub)}
.sech{display:flex;align-items:center;gap:8px;margin:18px 0 4px;font-size:17px;font-weight:800}.sech .bar{width:6px;height:20px;border-radius:3px}
.card.pub{border-left:5px solid #2563eb}.card.pri{border-left:5px solid #db2777}.card.unk{border-left:5px solid var(--line)}
.addrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:8px 0}.addrow button{min-height:48px;font-weight:700}
.b-pub{background:#2563eb!important;border-color:#2563eb!important;color:#fff!important}.b-pri{background:#db2777!important;border-color:#db2777!important;color:#fff!important}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.sum3 div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.sum3 b{display:block;font-size:20px}.sum3 span{font-size:12px;color:var(--sub)}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0}
.wk button{padding:6px 2px;border-radius:12px;flex-direction:column;gap:1px;min-height:74px;font-size:11px;line-height:1.25;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.wk button b{font-size:15px}.wk button small{font-size:10px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wk button.td{border:2px solid var(--brand)}.wk .st{font-size:13px;font-weight:800}
.wk .done{background:var(--brand2)}.wk .done .st{color:var(--brand)}.wk .miss .st{color:var(--bad)}.wk .rest{opacity:.55}
.chk{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);margin:0;color:var(--ink);font-size:15px}.chk:first-child{border-top:0}
.chk input{width:22px;height:22px;flex:0 0 auto;accent-color:var(--brand)}.chk.on span{text-decoration:line-through;color:var(--sub)}
.prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.prog i{display:block;height:100%;background:var(--brand);border-radius:99px}
.ed-day{border:1px solid var(--line);border-radius:14px;padding:10px;margin:10px 0}
.ed-it{border-top:1px dashed var(--line);padding:8px 0 4px}.ed-it:first-of-type{border-top:0}.ed-it .r1{display:flex;gap:4px;align-items:center}.ed-it .r1 input{flex:1;padding:8px;font-weight:600}.ed-it .ops{display:flex}
.ed-it .r2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:var(--sub)}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.stp button{border:0;border-radius:0;padding:6px 10px;background:none;font-size:16px;color:var(--ink)}.stp input{width:44px;border:0;border-radius:0;text-align:center;padding:6px 0;background:none;font-weight:700;font-size:15px}
.ed-it select{width:auto;padding:6px 8px}.ed-it .note{flex:1;min-width:90px;padding:6px 8px;font-size:13px}
.ed-it .ops button{padding:4px 6px;border:0;background:none;color:var(--sub)}
.dsel{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dsel span{text-align:center;padding:8px 0;border-radius:10px;border:1px solid var(--line);cursor:pointer;font-weight:700}.dsel span.on{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
.plist .item .b{cursor:pointer}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mcal .h{text-align:center;font-size:12px;color:var(--sub);padding:4px 0;font-weight:700}.mcal .h:first-child{color:#dc2626}.mcal .h:last-child{color:#2563eb}
.mcal button{min-height:76px;padding:4px 3px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:2px;font-size:11px;overflow:hidden}
.mcal button .dn{font-size:13px;font-weight:700;text-align:left}.mcal button.out{opacity:.35}.mcal button.td{border:2px solid var(--brand)}.mcal button.sun .dn{color:#dc2626}.mcal button.sat .dn{color:#2563eb}

.ev.pub{background:#dbeafe;color:#1d4ed8}.ev.pri{background:#fce7f3;color:#be185d}.ev.unk{background:var(--line);color:var(--sub)}.ev.mt{box-shadow:inset 3px 0 0 #ea580c}
.mcal .more{font-size:10px;color:var(--sub);text-align:left}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:6px 0}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
@media (prefers-color-scheme:dark){.ev.pub{background:#172554;color:#93c5fd}.ev.pri{background:#3b0a24;color:#f9a8d4}}
.mnew{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:10px 0;overflow:hidden}
.mnew summary{list-style:none;cursor:pointer;padding:14px;font-weight:800;display:flex;align-items:center;gap:8px}.mnew summary::-webkit-details-marker{display:none}

.mtl{list-style:none;margin:0;padding:0}.mtl li{display:flex;align-items:center;gap:10px;padding:13px 4px;border-top:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none}.mtl li:first-child{border-top:0}
.mtl li .t{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mtl li.tap{background:var(--brand2)}

textarea.auto{overflow:hidden;resize:none;min-height:120px}
.wres .big3{font-size:22px;font-weight:800;margin:6px 0 2px}.wres .ws{margin-top:12px}.wres .ws b{display:block;margin-bottom:4px}
.whist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.whist button{padding:0;border-radius:12px;overflow:hidden;flex-direction:column;align-items:stretch;gap:0;font-size:11px}

.faq{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.faq .chip{font-size:12px;padding:5px 10px}
.mcal .ev{touch-action:none;cursor:grab}.mcal button.drop{outline:3px dashed var(--brand);outline-offset:-3px;background:var(--brand2)}

<script>
/* ===================== 기본 ===================== */
const TABS=[['home','M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z','홈'],['plan','M4 6h16v14H4zM4 10h16M8 3v4M16 3v4','일정'],['cook','M3 11h18a9 7 0 0 1-18 0zM8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4','요리'],['fit','M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12','운동'],['more','M4 6h16M4 12h16M4 18h16','더보기']];
const svgI=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const SHEETS={메모:['제목','내용','태그','고정'],일정:['구분','종류','제목','날짜','종료일','시작','종료','장소','상대','메모','캘린더ID'],맛집:['이름','지역','메뉴','테마','평점','가격대','방문','메모'],장소:['이름','주소','종류'],식재료:['이름','수량','보관','유통기한'],레시피:['이름','재료','조리법','칼로리','시간','출처'],운동:['날짜','종류','부위','세트시간','칼로리','메모'],식단:['날짜','끼니','음식','칼로리','메모']};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dname=s=>{const d=new Date(s+'T00:00');return (d.getMonth()+1)+'/'+d.getDate()+' ('+'일월화수목금토'[d.getDay()]+')'};
const uid=()=>Math.random().toString(36).slice(2,10);
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.]/g,''));return isNaN(n)?0:n};
function toast(m,ms=2400){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}

const LS={get(k,d){try{const v=localStorage.getItem('life.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('life.'+k,JSON.stringify(v))}catch(e){}}};
let DB=LS.get('db',{});for(const k in SHEETS)DB[k]=DB[k]||[];
let Q=LS.get('queue',[]);
let CFG=LS.get('cfg',{url:'',kcal:'',hasAI:false,sheetUrl:''});
let CAL=LS.get('cal',[]);
let tab=location.hash.slice(1)||'home', sub=LS.get('sub',{}), SCR={};
let CK=LS.get('cook',{q:'',fridge:null,sel:[],busy:{}});CK.busy={};const saveCK=()=>LS.set('cook',CK);
let THM=LS.get('themes',[]),THM_AT=LS.get('themesAt',0);
let DEL=LS.get('del',{});
const saveLocal=()=>{LS.set('db',DB);LS.set('queue',Q);LS.set('del',DEL);CLOUD.dirty()};

/* ===================== Google 로그인 · 클라우드 (여행 플래너와 같은 Firebase) =====================
   - users/{내uid}/life/state 문서에 설정(서버 주소·목표 칼로리·운동 계획)과 데이터를 저장
   - 보안 규칙: 로그인한 본인만 읽기/쓰기 (firestore.rules)
   - 서버 주소를 한 기기에서만 넣으면, 다른 기기는 로그인만 하면 자동으로 받아옴 */
const FB_VER='10.12.2';
function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
const CLOUD={auth:null,db:null,user:null,ready:false,failed:false,t:null,busy:false,
  async init(){
    try{
      await loadScript('../firebase-config.js');
      if(!window.FIREBASE_CONFIG||!window.FIREBASE_CONFIG.apiKey)throw new Error('no config');
      for(const m of ['app','auth','firestore'])await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`);
      const fb=window.firebase;if(!fb.apps.length)fb.initializeApp(window.FIREBASE_CONFIG);
      this.auth=fb.auth();this.db=fb.firestore();
      try{await this.auth.setPersistence(fb.auth.Auth.Persistence.LOCAL)}catch(e){}
      try{await this.auth.getRedirectResult()}catch(e){}
      this.auth.onAuthStateChanged(async u=>{this.user=u;this.ready=true;paintAcct();if(u){await this.pull();}render()});
    }catch(e){this.failed=true;this.ready=true;paintAcct();console.warn('cloud',e)}
  },
  async login(){
    if(!this.auth){toast(this.failed?'로그인 기능을 불러오지 못했어요. 인터넷 연결을 확인해 주세요':'잠시 후 다시 눌러 주세요');return}
    const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
    try{await this.auth.signInWithPopup(p)}
    catch(e){const c=e&&e.code||'';
      if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){try{await this.auth.signInWithRedirect(p)}catch(x){toast('로그인하지 못했어요: '+(x.code||x.message))}}
      else if(c==='auth/unauthorized-domain')toast('Firebase에 이 주소가 승인되지 않았어요');
      else if(c!=='auth/popup-closed-by-user'&&c!=='auth/cancelled-popup-request')toast('로그인하지 못했어요: '+(c||e.message))}
  },
  async logout(){if(this.auth&&confirm('로그아웃할까요? (이 기기 데이터는 그대로 남아요)')){await this.auth.signOut();render()}},
  ref(){return this.db.collection('users').doc(this.user.uid).collection('life').doc('state')},
  cfgOut(){return {url:CFG.url||'',kcal:CFG.kcal||'',hasAI:!!CFG.hasAI,sheetUrl:CFG.sheetUrl||'',plan:LS.get('plan',null),at:CFG.at||0,themes:THM,themesAt:THM_AT,plans:LS.get('plans',[]),woOv:LS.get('woOv',{}),plansAt:LS.get('plansAt',0)}},
  async pull(){
    if(!this.user)return;this.busy=true;setSync('☁︎ 불러오는 중…');
    try{
      const snap=await this.ref().get();const r=snap.exists?snap.data():{};
      const rc=r.cfg||{};
      if((rc.plansAt||0)>LS.get('plansAt',0)){LS.set('plans',rc.plans||[]);LS.set('woOv',rc.woOv||{});if(rc.plan!==undefined)LS.set('plan',rc.plan);LS.set('plansAt',rc.plansAt)}else if(LS.get('plansAt',0)>(rc.plansAt||0))await this.saveCfg(true);
      if((rc.themesAt||0)>THM_AT){THM=rc.themes||[];THM_AT=rc.themesAt;LS.set('themes',THM);LS.set('themesAt',THM_AT)}else if(THM_AT>(rc.themesAt||0))await this.saveCfg(true);
      if(rc.url&&(!CFG.url||(rc.at||0)>(CFG.at||0))){
        const changed=rc.url!==CFG.url;
        Object.assign(CFG,{url:rc.url,kcal:rc.kcal||CFG.kcal,hasAI:!!rc.hasAI,sheetUrl:rc.sheetUrl||CFG.sheetUrl,at:rc.at||Date.now()});
        if(rc.plan)LS.set('plan',rc.plan);LS.set('cfg',CFG);
        if(changed)toast('✅ 내 계정에 저장된 서버 연결을 불러왔어요 (시트·캘린더·AI 사용 가능)',3500);
        if(changed){const have=new Set(Q.map(o=>o.sheet+'|'+(o.row&&o.row.id)));for(const k in SHEETS)DB[k].forEach(r=>{if(!have.has(k+'|'+r.id))Q.push({action:'upsert',sheet:k,row:r})});LS.set('queue',Q)}
      }else{
        if(!rc.kcal&&CFG.kcal||!rc.plan&&LS.get('plan',null)||CFG.url&&!rc.url||(CFG.at||0)>(rc.at||0))await this.saveCfg(true);
        if(rc.kcal&&!CFG.kcal){CFG.kcal=rc.kcal;LS.set('cfg',CFG)}
        if(rc.plan&&!LS.get('plan',null))LS.set('plan',rc.plan);
      }
      if(!CFG.url&&r.data){mergeData(JSON.parse(r.data),r.del?JSON.parse(r.del):{});LS.set('db',DB);LS.set('del',DEL)}
      this.busy=false;
      if(CFG.url)await sync(true);else{await this.pushData(true);setSync('☁︎ 동기화 '+new Date().toTimeString().slice(0,5))}
    }catch(e){this.busy=false;setSync('☁︎ 오프라인');console.warn(e)}
  },
  async saveCfg(now){if(!this.user)return;try{await this.ref().set({cfg:this.cfgOut()},{merge:true})}catch(e){console.warn(e)}},
  dirty(){if(!this.user||CFG.url||this.busy)return;clearTimeout(this.t);this.t=setTimeout(()=>this.pushData(),1500)},
  async pushData(){if(!this.user||CFG.url)return;try{await this.ref().set({data:JSON.stringify(DB),del:JSON.stringify(DEL),at:Date.now()},{merge:true});setSync('☁︎ 동기화 '+new Date().toTimeString().slice(0,5))}catch(e){setSync('☁︎ 대기 중')}}
};
function mergeData(R,RD){
  for(const k in RD){DEL[k]=DEL[k]||{};for(const id in RD[k])DEL[k][id]=Math.max(DEL[k][id]||0,RD[k][id])}
  for(const k in SHEETS){
    const m={};for(const x of DB[k])m[x.id]=x;
    for(const x of (R[k]||[])){const c=m[x.id];if(!c||(x._t||0)>(c._t||0))m[x.id]=x}
    const D=DEL[k]||{};DB[k]=Object.values(m).filter(x=>!(D[x.id]&&D[x.id]>=(x._t||0)));
  }
}

async function api(action,body={},timeout=60000){
  if(!CFG.url)throw new Error('서버 미연결');
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),timeout);
  try{
    const r=await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...body}),signal:ctl.signal});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'서버 오류');return j.data===undefined?j:j.data;
  }finally{clearTimeout(tm)}
}
function setSync(t){$('#sync').textContent=t}
let syncing=false;
async function sync(full=true){
  if(!CFG.url){if(CLOUD.user)CLOUD.dirty();else setSync(CLOUD.ready?'로컬 모드':'…');return}
  if(syncing)return;syncing=true;setSync('동기화 중…');
  try{
    if(Q.length){
      const ops=Q.slice(0,40);const res=await api('batch',{ops});
      res.forEach((r,i)=>{if(r.ok&&ops[i].action==='upsert'){const L=DB[ops[i].sheet];const k=L.findIndex(x=>x.id===r.data.id);if(k>=0)L[k]=Object.assign(L[k],r.data)}});
      Q=Q.slice(ops.length);saveLocal();
      if(Q.length){syncing=false;return sync(full)}
    }
    if(full){
      const d=await api('listAll');for(const k in SHEETS)DB[k]=d[k]||[];saveLocal();
      try{CAL=await api('calList',{from:addDays(today(),-7),to:addDays(today(),45)});LS.set('cal',CAL);try{woCalReconcile()}catch(e){console.warn(e)}}catch(e){}
    }
    setSync('✓ 동기화 '+new Date().toTimeString().slice(0,5));render();
  }catch(e){setSync(Q.length?'⏳ 대기 '+Q.length+'건':'오프라인');console.warn(e)}
  syncing=false;
}
function put(sheet,row){
  row=Object.assign({},row);if(!row.id)row.id=uid();
  const now=new Date().toISOString().slice(0,16).replace('T',' ');if(!row['생성'])row['생성']=now;row['수정']=now;row._t=Date.now();
  const L=DB[sheet];const k=L.findIndex(x=>x.id===row.id);if(k>=0)L[k]=Object.assign(L[k],row);else L.push(row);
  Q=Q.filter(o=>!(o.action==='upsert'&&o.sheet===sheet&&o.row.id===row.id));Q.push({action:'upsert',sheet,row});saveLocal();sync(false);return row;
}
function del(sheet,id){
  DB[sheet]=DB[sheet].filter(x=>x.id!==id);(DEL[sheet]=DEL[sheet]||{})[id]=Date.now();Q=Q.filter(o=>!(o.sheet===sheet&&o.row&&o.row.id===id));Q.push({action:'remove',sheet,id});saveLocal();sync(false);
}
async function ai(prompt,image,mime){
  if(!CFG.url)throw new Error('AI 기능은 서버 연결 후 사용할 수 있어요 (더보기 → 설정).');
  const waits=[4000,10000,20000];
  for(let i=0;;i++){
    try{return await api('ai',{prompt,image,mime},120000)}
    catch(e){
      const busy=/\((500|503)|high demand|overloaded|UNAVAILABLE/i.test(e.message);
      if(!busy||i>=waits.length)throw new Error(busy?'지금 구글 AI 서버가 붐벼요(일시적). 1~2분 뒤 다시 눌러 주세요.':e.message);
      toast(`AI 서버가 붐벼서 ${waits[i]/1000}초 뒤 자동 재시도할게요 (${i+1}/${waits.length})`,waits[i]);
      await new Promise(r=>setTimeout(r,waits[i]));
    }
  }
}
function imgToB64(file,max=1024){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.82);ok({b64:u.split(',')[1],url:u})};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}

function form(sheet,row={},opt={}){

  for(const k in f){const c=f[k],v=row[k]??c.def??'';
    if(c.t==='kind'){const kv=v||opt.kind||'사적';h+=`<label>구분</label><div class="kind"><label class="pub ${kv==='공적'?'on':''}"><input type="radio" name="${k}" value="공적" ${kv==='공적'?'checked':''}>💼 공적 일정</label><label class="pri ${kv==='사적'?'on':''}"><input type="radio" name="${k}" value="사적" ${kv==='사적'?'checked':''}>🏠 사적 일정</label></div>`;continue}
    if(c.t==='check'){h+=`<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="${k}" style="width:auto" ${v===true||v==='TRUE'||v==='true'?'checked':''}> ${c.l}</label>`;continue}
    h+=`<label>${c.lab||k}</label>`;
    if(c.t==='area')h+=`<textarea name="${k}">${esc(v)}</textarea>`;
    else if(c.t==='sel')h+=`<select name="${k}">${c.o.map(o=>`<option ${o===String(v)?'selected':''}>${o}</option>`).join('')}</select>`;
    else h+=`<input name="${k}" type="${c.t||'text'}" value="${esc(v)}" placeholder="${esc(c.ph||'')}" ${c.dl?`list="${c.dl}"`:''}>`;
  }
  if(sheet==='일정')h+=`<label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" name="_cal" style="width:auto" ${CFG.url&&(!row.id||row['캘린더ID'])?'checked':''} ${CFG.url?'':'disabled'}> 구글 캘린더에도 등록 ${CFG.url?'':'(서버 연결 후 가능)'}</label>`;

  d.innerHTML=h;d.showModal();
  if(f.구분){const kd=d.querySelector('.kind'),ph={공적:'참석자·거래처',사적:'함께하는 사람'};const sync=()=>{const v=d.querySelector('[name=구분]:checked').value;kd.querySelectorAll('label').forEach(l=>l.classList.toggle('on',l.querySelector('input').checked));d.querySelector('h3').textContent=(row.id?'':'')+(v==='공적'?'💼 공적 일정':'🏠 사적 일정')+(row.id?' 수정':' 추가');d.querySelector('[name=상대]').placeholder=ph[v]};kd.onchange=sync;sync()}
  if(!row.id&&f.날짜&&!row.날짜)d.querySelector('[name=날짜]').value=today();
  d.onclose=async()=>{
    const fm=d.querySelector('form');if(!fm)return;
    if(d.returnValue==='del'){if(!confirm('삭제할까요?'))return;
      if(sheet==='일정'&&row['캘린더ID']&&CFG.url)api('calDelete',{eventId:row['캘린더ID']}).catch(()=>{});
      del(sheet,row.id);toast('삭제했어요');render();return}
    if(d.returnValue!=='ok')return;
    const o=Object.assign({},row);for(const k in f){const el=fm.elements[k];o[k]=f[k].t==='check'?el.checked:f[k].t==='kind'?(fm.querySelector(`[name=${k}]:checked`)||{}).value||'사적':el.value.trim()}
    const first=Object.keys(f).find(k=>!f[k].t||f[k].t==='text');
    if(first&&!o[first]&&sheet!=='운동'){toast(first+'을(를) 입력해 주세요');return}
    if(sheet==='일정'&&o.종료일&&o.종료일<=o.날짜){if(o.종료일<o.날짜)toast('종료일이 시작일보다 빨라서 시작일 하루 일정으로 저장했어요',3500);o.종료일=''}

const PH={
  town:{q:'Seoul skyline sunset',fb:'img/rest-hero.svg'},
  gym:{q:'gym dumbbells weight training',fb:'img/hero-gym.svg'},
  cook:{q:'Korean cuisine table banchan',fb:'img/food-banner.svg'},
  street:{q:'Gwangjang Market',fb:'img/rest-hero.svg'},

  store:{q:'Korean restaurant exterior',fb:'img/rest-store.svg'}

const PHC=LS.get('phc',{});
const PHP={};
function phList(slot){
  const c=PHC[slot];if(c&&c.list&&c.list.length&&Date.now()-(c.at||0)<30*864e5)return Promise.resolve(c);
  if(PHP[slot])return PHP[slot];
  const u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=24&gsrsearch='+encodeURIComponent(PH[slot].q+' filetype:bitmap')+'&prop=imageinfo&iiprop=url|size|mime|extmetadata&iiextmetadatafilter=Artist|LicenseShortName&iiurlwidth=1280';
  return PHP[slot]=fetch(u).then(r=>r.json()).then(j=>{
    const pages=Object.values((j.query||{}).pages||{}).sort((a,b)=>(a.index||0)-(b.index||0));
    const list=pages.map(p=>{const ii=(p.imageinfo||[])[0]||{},md=ii.extmetadata||{};
      return {u:ii.thumburl||'',w:ii.width||0,h:ii.height||0,m:ii.mime||'',a:String((md.Artist||{}).value||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim().slice(0,40),l:String((md.LicenseShortName||{}).value||''),p:ii.descriptionurl||''}})
      .filter(x=>x.u&&/jpe?g/i.test(x.m)&&x.w>=x.h*1.2&&x.w>=1000).slice(0,10);
    const c2={list,i:c&&c.i||0,at:Date.now()};if(list.length){PHC[slot]=c2;LS.set('phc',PHC)}return c2;
  }).catch(()=>c||null).finally(()=>{delete PHP[slot]});
}
const phImg=(slot,cls='')=>`<img ${cls?`class="${cls}"`:''} data-photo="${slot}" src="${PH[slot].fb}" alt="">`;
function fillPhotos(root=document){
  root.querySelectorAll('img[data-photo]').forEach(async im=>{const s=im.dataset.photo;const c=await phList(s);if(!c||!c.list.length||!im.isConnected)return;
    const x=c.list[c.i%c.list.length];if(im.getAttribute('src')!==x.u)im.src=x.u;
    root.querySelectorAll(`[data-credit="${s}"]`).forEach(cr=>{cr.innerHTML=`📷 <a href="${esc(x.p)}" target="_blank" rel="noopener">${esc(x.a||'작가 미상')}</a> · ${esc(x.l||'자유 라이선스')} · Wikimedia Commons`})});
}

/* ---- 일정 (공적 · 사적 분리) ---- */
const KIND_RE=/^\s*\[(공적|사적)\]\s*/;
function kindOf(x){if(x.구분==='공적'||x.구분==='사적')return x.구분;const m=String(x.제목||'').match(KIND_RE);return m?m[1]:'미분류'}
function kindTag(g){return g==='공적'?'<span class="tag pub">💼 공적</span>':g==='사적'?'<span class="tag pri">🏠 사적</span>':'<span class="tag unk">미분류</span>'}
const evEnd=x=>x.종료일&&x.종료일>x.날짜?x.종료일:x.날짜;
const covers=(x,d)=>x.날짜<=d&&d<=evEnd(x);
const rangeTxt=x=>evEnd(x)!==x.날짜?`${dname(x.날짜).split(' ')[0]}~${dname(evEnd(x)).split(' ')[0]}`:'';
function calRows(){return CAL.filter(x=>!DB.일정.some(y=>y['캘린더ID']===x.eventId)).map(x=>{const m=String(x.title||'').match(KIND_RE);return {제목:String(x.title||'').replace(KIND_RE,''),구분:m?m[1]:'',날짜:x.date,시작:x.start,장소:x.location,종류:'캘린더',_cal:1,eventId:x.eventId,종료일:x.endDate&&x.endDate>x.date?x.endDate:'',종료:x.end||'',_title:x.title}})}
function planList(rows,mode,t){
  if(mode==='약속')rows=rows.filter(x=>x.종류==='약속');
  rows=mode==='지난'?rows.filter(x=>x.날짜<t).sort((a,b)=>b.날짜.localeCompare(a.날짜)):rows.filter(x=>x.날짜>=t).sort((a,b)=>(a.날짜+(a.시작||'')).localeCompare(b.날짜+(b.시작||'')));
  return rows;
}
function planCards(rows,t,cls){
  const g={};rows.forEach(x=>(g[x.날짜]=g[x.날짜]||[]).push(x));
  return Object.keys(g).slice(0,60).map(dt=>`<div class="card ${cls}"><h2>${dname(dt)}${dt===t?' <span class="tag">오늘</span>':''}</h2>${g[dt].map(x=>`<div class="item" ${x._cal?'':`data-ed="일정|${x.id}"`}><div class="muted" style="width:46px">${x.시작||'종일'}</div><div class="b"><div class="t">${esc(x.제목)}</div><div class="d">${esc([x.장소,x.상대&&(kindOf(x)==='공적'?'참석: ':'with ')+x.상대].filter(Boolean).join(' · '))}</div></div>${x.종류==='약속'?'<span class="tag w">약속</span>':''}${x._cal?'<span class="tag">캘린더</span>':x['캘린더ID']?'<span class="tag">☁︎</span>':''}</div>`).join('')}</div>`).join('');
}

function calItems(view,mode){let L=[...DB.일정,...calRows()];if(mode==='약속')L=L.filter(x=>x.종류==='약속');if(view!=='전체')L=L.filter(x=>kindOf(x)===view);return L}
function monthCal(view,mode){
  const t=today(),ym=sub.cm||t.slice(0,7),[Y,M]=ym.split('-').map(Number),first=new Date(Y,M-1,1),start=addDays(ym+'-01',-first.getDay());
  const L=calItems(view,mode),by={};L.forEach(x=>{let d=x.날짜;const e=evEnd(x);for(let i=0;i<62&&d<=e;i++,d=addDays(d,1))(by[d]=by[d]||[]).push(x)});for(const k in by)by[k].sort((a,b)=>(evEnd(b)>b.날짜)-(evEnd(a)>a.날짜)||(a.시작||'').localeCompare(b.시작||''));
  const cls=x=>({공적:'pub',사적:'pri'}[kindOf(x)]||'unk')+(x.종류==='약속'?' mt':'');
  const cells=[...Array(42)].map((_,i)=>{const d=addDays(start,i),E=by[d]||[],dw=i%7;
    return `<button class="${d.slice(0,7)!==ym?'out':''} ${d===t?'td':''} ${dw===0?'sun':dw===6?'sat':''}" data-act="calDay" data-d="${d}" aria-label="${dname(d)} 일정 ${E.length}건"><span class="dn">${+d.slice(8)}</span>${E.slice(0,2).map(x=>{const multi=evEnd(x)>x.날짜,first=d===x.날짜||dw===0;return `<span class="ev ${cls(x)}${multi?' multi'+(d===x.날짜?' s':'')+(d===evEnd(x)?' e':''):''}" data-mv="${x._cal?'c|'+esc(x.eventId):'d|'+x.id}">${first?(x.시작&&d===x.날짜?x.시작.slice(0,5)+' ':'')+esc(x.제목):'&nbsp;'}</span>`}).join('')}${E.length>2?`<span class="more">+${E.length-2}</span>`:''}</button>`}).join('');
  const mv=n=>{const d=new Date(Y,M-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
  return `<div class="card"><h2>${Y}년 ${M}월<span class="sp"></span><button class="s" data-act="chip" data-k="cm" data-v="${mv(-1)}" aria-label="이전 달">‹</button><button class="s" data-act="chip" data-k="cm" data-v="${t.slice(0,7)}">오늘</button><button class="s" data-act="chip" data-k="cm" data-v="${mv(1)}" aria-label="다음 달">›</button></h2>
   <div class="legend"><span><i style="background:#2563eb"></i>공적</span><span><i style="background:#db2777"></i>사적</span><span><i style="background:#ea580c"></i>약속</span><span><i style="background:var(--line)"></i>미분류·캘린더</span></div>
   <p class="muted" style="margin:0 0 6px">💡 일정을 <b>끌어서</b>(휴대폰은 <b>길게 누른 뒤 끌기</b>) 다른 날짜에 놓으면 옮겨져요.</p>
   <div class="mcal">${'일월화수목금토'.split('').map(w=>`<div class="h">${w}</div>`).join('')}${cells}</div></div>`;
}
/* ===== 달력 드래그로 날짜 옮기기 (마우스: 끌기 / 휴대폰: 길게 눌러 끌기) ===== */
let DRAG=null,DRAG_JUST=0;
function calDragBind(){const cal=document.querySelector('.mcal');if(!cal)return;
  cal.querySelectorAll('.ev[data-mv]').forEach(ev=>{
    ev.onpointerdown=e=>{if(e.button>0)return;const cell=ev.closest('button[data-d]');const st={ev,from:cell.dataset.d,key:ev.dataset.mv,x:e.clientX,y:e.clientY,on:0,id:e.pointerId,touch:e.pointerType!=='mouse'};
      st.timer=st.touch?setTimeout(()=>start(st),350):0;DRAG=st;
      const start=s=>{if(s.on)return;s.on=1;navigator.vibrate&&navigator.vibrate(15);try{ev.setPointerCapture(s.id)}catch(_){}ev.classList.add('lift');
        const g=document.createElement('div');g.className='dragghost ev '+[...ev.classList].filter(c=>c==='pub'||c==='pri'||c==='unk').join(' ');g.textContent='📅 '+ev.textContent;document.body.appendChild(g);s.g=g;move(s.x,s.y)};
      const move=(x,y)=>{if(!DRAG||!DRAG.g)return;DRAG.g.style.left=x+'px';DRAG.g.style.top=y+'px';cal.querySelectorAll('.drop').forEach(c=>c.classList.remove('drop'));
        const el=document.elementFromPoint(x,y),c=el&&el.closest&&el.closest('.mcal button[data-d]');if(c&&c.dataset.d!==DRAG.from)c.classList.add('drop');DRAG.over=c?c.dataset.d:''};
      ev.onpointermove=m=>{const s=DRAG;if(!s)return;const dx=m.clientX-s.x,dy=m.clientY-s.y;
        if(!s.on){if(s.touch){if(Math.hypot(dx,dy)>10){clearTimeout(s.timer);DRAG=null}return}if(Math.hypot(dx,dy)>6)start(s);else return}
        m.preventDefault();move(m.clientX,m.clientY)};

async function exifGPS(file){try{const b=new DataView(await file.slice(0,262144).arrayBuffer());if(b.getUint16(0)!==0xFFD8)return null;let o=2;
  while(o<b.byteLength-4){const mk=b.getUint16(o);if(mk===0xFFE1&&b.getUint32(o+4)===0x45786966){const t=o+10,le=b.getUint16(t)===0x4949,g16=x=>b.getUint16(x,le),g32=x=>b.getUint32(x,le);

      const gp=ifd(g32(t+4),0x8825);if(!gp)return null;const n=g16(t+gp),r={};
      for(let i=0;i<n;i++){const e=t+gp+2+i*12,tag=g16(e),vo=t+g32(e+8);

        if(tag===2||tag===4)r[tag]=[0,1,2].map(k=>g32(vo+k*8)/(g32(vo+k*8+4)||1)).reduce((a,v,k)=>a+v/Math.pow(60,k),0)}

    if((mk&0xFF00)!==0xFF00)break;o+=2+b.getUint16(o+2)}return null}catch(e){return null}}

const DIMG=LS.get('dimg',{});
async function wikiImg(name){
  const key=String(name).trim();if(key in DIMG)return DIMG[key];
  const api=q=>fetch('https://ko.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=480&redirects=1&'+q).then(r=>r.json());
  let u='';
  try{
    let j=await api('titles='+encodeURIComponent(key));let pg=Object.values((j.query||{}).pages||{})[0]||{};u=(pg.thumbnail||{}).source||'';
    if(!u){j=await api('generator=search&gsrlimit=1&gsrsearch='+encodeURIComponent(key));pg=Object.values((j.query||{}).pages||{})[0]||{};
      const tt=String(pg.title||'');if(tt&&(key.includes(tt)||tt.includes(key)))u=(pg.thumbnail||{}).source||''}
  }catch(e){return ''}
  DIMG[key]=u;LS.set('dimg',DIMG);return u;
}
function fillImgs(root=document){root.querySelectorAll('img[data-dish]').forEach(async im=>{const u=await wikiImg(im.dataset.dish);if(u&&im.isConnected){im.src=u;im.title='사진: 위키백과'}})}

const hasIng=(list,w)=>list.some(x=>x.includes(w)||w.includes(x));
function matchRecipes(have){
  return RECIPES.map(r=>{const okM=r.main.filter(w=>hasIng(have,w)),okO=r.opt.filter(w=>hasIng(have,w));
    return {r,okM,okO,miss:r.main.filter(w=>!hasIng(have,w)),score:okM.length*3+okO.length-(r.main.length-okM.length)*4}})
   .filter(x=>x.okM.length||x.okO.length>=2).sort((a,b)=>b.score-a.score);
}
/* 레시피 검색: 이름·재료·분류어·동의어(생선→고등어·갈치…)·부분 일치 + 점수순 */
function rcpSearch(q,cat){q=String(q||'').trim();const SY=window.RCP_SYN||{};
  const words=q?[...new Set(q.split(/[\s,]+/).filter(Boolean))]:[];const terms=new Set();words.forEach(w=>{terms.add(w);(SY[w]||[]).forEach(x=>terms.add(x));const w2=w.replace(/(요리|반찬|레시피|만들기|으로|로)$/,'');if(w2&&w2!==w){terms.add(w2);(SY[w2]||[]).forEach(x=>terms.add(x))}});
  return RECIPES.map(r=>{if(cat&&r.c!==cat)return null;if(!q)return {r,sc:1};let sc=0;const tg=r.tag||[];
    for(const t of terms){if(r.n.includes(t))sc+=8;if(r.main.some(m=>m.includes(t)||t.includes(m)&&m.length>1))sc+=5;if(tg.some(g=>g.includes(t)))sc+=5;if(r.c.includes(t))sc+=3;if(r.opt.some(m=>m.includes(t)))sc+=2;if((r.sea||'').includes(t))sc+=1}
    return sc?{r,sc}:null}).filter(Boolean).sort((a,b)=>b.sc-a.sc).map(x=>x.r)}

  const past=[];for(let i=1;i<=56;i++){const d=addDays(t,-i);if(d<st)break;if(sessionFor(d))past.push(d)}

let WO_SYNC=0;
async function woCalSyncDays(days){const p=LS.get('plan',null);if(!p||!CFG.url||(!p.calSync&&!calList(p).length))return;
  const L=calList(p),tm=p.time||'19:00',[h,mi]=tm.split(':').map(Number),end=String(Math.min(23,h+1)).padStart(2,'0')+':'+String(mi).padStart(2,'0'),lim=addDays(today(),27);let ch=0;
  for(const ds of [...new Set(days)]){const s=sessionFor(ds),i=L.findIndex(x=>x.d===ds);
    try{if(s&&(i>=0||(p.calSync&&ds>=today()&&ds<=lim))){const id=await api('calSave',{ev:{eventId:i>=0?L[i].id:undefined,title:'[사적] 🏋️ '+s.title,date:ds,start:tm,end,location:'',description:s.items.join('\n')+'\n(나의 하루 운동 계획: '+p.name+')'}});if(i>=0)L[i].id=id;else L.push({d:ds,id});ch++}
      else if(!s&&i>=0){await api('calDelete',{eventId:L[i].id});L.splice(i,1);ch++}}catch(e){console.warn(e)}}
  if(ch){savePlanCal(p,L);WO_SYNC=Date.now()}}
/* 캘린더 → 앱: 구글 캘린더에서 옮기거나 지우거나 고친 운동을 계획에 반영 */
function woCalReconcile(){const p=LS.get('plan',null);if(!p)return;const L=calList(p);if(!L.length)return;const ov=LS.get('woOv',{}),t=today(),from=addDays(t,-7),to=addDays(t,45);let n=0;const keep=[],stale=[];
  for(const x of L){if(!x.d||x.d<from){if(x.d&&x.d>=addDays(t,-60))keep.push(x);continue}
    const c=CAL.find(e=>e.eventId===x.id),s=sessionFor(x.d);
    if(!c){if(x.d<=to){if(s){ov[x.d]='skip';n++}}else keep.push(x);continue}
    const title=String(c.title||'').replace(/^\s*\[(공적|사적)\]\s*/,'').replace(/^🏋️\s*/,'').trim()||(s&&s.title)||'운동';
    let items=s?s.items:[];if(c.description!=null){const di=String(c.description).split('\n').map(v=>v.trim()).filter(v=>v&&!/^\(나의 하루/.test(v));if(di.length)items=di}
    if(c.date!==x.d){ov[c.date]={title,items};if(s||baseFor(x.d))ov[x.d]='skip';x.d=c.date;n++}
    else if(s&&(title!==s.title||items.join('|')!==s.items.join('|'))){ov[x.d]={title,items};n++}
    else if(!s){stale.push(x.d)}
    keep.push(x)}
  const tm=(L[0]&&CAL.find(e=>e.eventId===L[0].id)||{}).start;
  if(n||keep.length!==L.length){LS.set('woOv',ov);savePlanCal(p,keep);if(n)toast(`📆 구글 캘린더에서 바뀐 운동 ${n}건을 계획에 반영했어요`,3500)}
  if(stale.length)woCalSyncDays(stale); /* 앱에서 제외한 날인데 캘린더에 남아 있으면 캘린더 쪽을 지움 */
  /* 자동 연동이 켜져 있으면 새로 4주 범위에 들어온 날을 채움 */
  if(p.calSync&&Date.now()-WO_SYNC>60000){const miss=[];for(let i=0;i<28;i++){const ds=addDays(t,i);if(sessionFor(ds)&&!calList(LS.get('plan',null)).some(x=>x.d===ds))miss.push(ds)}if(miss.length)woCalSyncDays(miss.slice(0,10))}}

function rtDaysOk(n,f){return f==='전체'||(f==='6+'?n>=6:n===+f)}
function rtMinOk(m,f){return f==='전체'||(f==='~30분'?m<=30:f==='31~50분'?m>30&&m<=50:m>50)}
function routineLib(){const F=Object.assign({goal:'전체',lv:'전체',days:'전체',place:'전체',min:'전체'},LS.get('rtf',{}));
  const L=ROUTINES.filter(r=>(F.goal==='전체'||r.goal===F.goal)&&(F.lv==='전체'||r.lv===F.lv)&&rtDaysOk(r.plan.length,F.days)&&(F.place==='전체'||r.place===F.place)&&rtMinOk(r.min,F.min));
  const row=(k,lab)=>`<div class="rtf"><b>${lab}</b>${RT_FILTERS[k].map(v=>`<span class="chip ${F[k]===v?'on':''}" data-act="rtF" data-k="${k}" data-v="${v}">${v==='전체'?'전체':k==='days'?'주 '+v+'회':v}</span>`).join('')}</div>`;
  return `<div class="hero" style="margin-top:4px"><b>🗂 목적별 운동 루틴 ${ROUTINES.length}가지</b><p style="margin:4px 0 0">목표를 먼저 고르고, 난이도·주 횟수·장소·시간으로 좁혀 보세요. 누르면 요일별 운동을 미리 보고 저장·적용할 수 있어요.</p></div>
   <div class="goalg">${RT_FILTERS.goal.map(g=>`<button class="${F.goal===g?'on':''}" data-act="rtF" data-k="goal" data-v="${g}"><span>${g==='전체'?'🗂':RT_ICON[g]}</span>${g}<small class="muted">${g==='전체'?ROUTINES.length:ROUTINES.filter(r=>r.goal===g).length}</small></button>`).join('')}</div>
   ${row('lv','난이도')}${row('days','주 횟수')}${row('place','장소')}${row('min','1회 시간')}
   <div class="row" style="justify-content:space-between;margin:4px 0"><b>${L.length}개 루틴</b>${Object.values(F).some(v=>v!=='전체')?'<button class="x" data-act="rtReset">필터 초기화</button>':''}</div>
   ${L.map(r=>`<button class="rtc" data-act="rtView" data-id="${r.id}"><div class="ttl">${RT_ICON[r.goal]||''} ${esc(r.n)}</div>
     <div class="meta"><span class="tag">${esc(r.goal)}</span><span class="tag w">${r.lv}</span><span class="tag">주 ${r.plan.length}회</span><span class="tag">${esc(r.place)}</span><span class="tag">약 ${r.min}분</span><span class="tag">${esc(r.focus)}</span></div>
     <div class="ds">${esc(r.desc)}</div><div class="wkd">${WEEK.map(w=>`<i class="${r.plan.some(d=>d.day===w)?'on':''}">${w}</i>`).join('')}</div></button>`).join('')||'<div class="card empty">조건에 맞는 루틴이 없어요. 필터를 줄여 보세요.</div>'}
   <p class="muted">세트·횟수는 일반적인 예시예요. 저장 후 ✏️ 편집에서 내 몸에 맞게 바꾸세요. 통증이 있으면 중단하고 전문가와 상의하세요.</p>`}
ACT.rtF=d=>{const F=LS.get('rtf',{});F[d.k]=F[d.k]===d.v&&d.v!=='전체'?'전체':d.v;LS.set('rtf',F);const y=scrollY;render();scrollTo(0,y)};
ACT.rtReset=()=>{LS.set('rtf',{});render()};
ACT.rtView=d=>{const r=ROUTINES.find(x=>x.id===d.id);if(!r)return;previewPlan({name:r.n,src:`${r.goal} · ${r.lv} · 주 ${r.plan.length}회 · ${r.place} · 약 ${r.min}분`,tip:r.desc,days:JSON.parse(JSON.stringify(r.plan))})};
ACT.previewBase=d=>previewPlan({name:d.k,src:'기본 계획',days:JSON.parse(JSON.stringify(PLANS[d.k].days))});
ACT.viewPlan=d=>{const x=LS.get('plans',[]).find(p=>p.id===d.id);if(x)previewPlan(x,{saved:1})};
ACT.usePlan=d=>{const x=LS.get('plans',[]).find(p=>p.id===d.id);if(!x)return;const cur=LS.get('plan',null);if(cur&&cur.id!==x.id&&!confirm(`지금 계획(${cur.name}) 대신 ‘${x.name}’을 오늘부터 적용할까요? (기록은 그대로 남아요)`))return;
  const np=Object.assign({},x,{start:today()});savePlans(LS.get('plans',[]).map(p=>p.id===x.id?np:p),np);LS.set('woOv',{});sub.pv='스케줄';toast('✅ ‘'+x.name+'’ 적용');render()};
ACT.editPlan=d=>{const x=LS.get('plans',[]).find(p=>p.id===d.id)||LS.get('plan',null);if(!x)return;openEditor(JSON.parse(JSON.stringify(x)),{})};
ACT.newPlan=()=>openEditor({name:'나의 계획',src:'직접 만들기',days:[{day:'월',title:'운동 A',items:[]},{day:'수',title:'운동 B',items:[]},{day:'금',title:'운동 C',items:[]}]},{});
/* 편집기: 요일 · 제목 · 운동(추가/삭제/순서) · 세트 */
/* 운동 항목: 문자열 "이름 3×10초 (메모)" ↔ {n,s,r,u,note} */
function parseIt(it){it=String(it||'').trim();if(!it)return {n:'',s:3,r:10,u:'회',note:''};let m=it.match(/^(.*?)\s+(\d+)\s*[×xX*]\s*(\d+)\s*(회|초|분)?\s*(.*)$/);
  if(m)return {n:m[1].trim(),s:+m[2],r:+m[3],u:m[4]||'회',note:m[5].replace(/^\(|\)$/g,'').trim()};
  m=it.match(/^(.*?)\s+(\d+)\s*(회|초|분)\s*(.*)$/);if(m)return {n:m[1].trim(),s:1,r:+m[2],u:m[3],note:m[4].replace(/^\(|\)$/g,'').trim()};
  return {n:it,s:0,r:0,u:'회',note:''}}
function fmtIt(o){const n=(o.n||'').trim();if(!n)return '';let x=n;
  if(o.r>0)x+=' '+(o.s>1||o.u==='회'?(o.s||1)+'×'+o.r+(o.u==='회'?'':o.u):o.r+o.u);
  if(o.note)x+=' ('+o.note+')';return x}
function openEditor(ED,opt){const dl=$('#dlg'),single=opt.single,ED0=JSON.stringify(ED.days);
  const draw=()=>{ED.days.sort((a,b)=>WEEK.indexOf(a.day)-WEEK.indexOf(b.day));
   dl.innerHTML=`<form method="dialog" style="padding:16px"><div class="backbar"><button type="button" id="edBack">← ${single?esc(dname(single))+' 운동으로':'뒤로'}</button></div><h3>${single?'✏️ '+esc(dname(single))+' 운동 수정':'✏️ 계획 편집'}</h3>
    ${single?'<p class="muted" style="margin:0">이 날짜에만 적용돼요. 원래 계획은 그대로예요.</p>':`<label>계획 이름</label><input data-f="name" value="${esc(ED.name)}">
    <label>운동 요일 (눌러서 추가/빼기)</label><div class="dsel">${WEEK.map(w=>`<span class="${ED.days.some(d=>d.day===w)?'on':''}" data-day="${w}">${w}</span>`).join('')}</div>`}
    ${ED.days.map((d,di)=>`<div class="ed-day"><div class="row" style="flex-wrap:nowrap">${single?'':`<span class="tag" style="font-size:14px">${d.day}</span>`}<input data-t="${di}" value="${esc(d.title)}" placeholder="제목 (예: 하체)" style="flex:1"></div>
     ${d.items.map((it,ii)=>{const o=parseIt(it),k=di+'.'+ii,stp=(f,v,lab)=>`<span>${lab}</span><span class="stp"><button type="button" data-st="${k}|${f}|-1" aria-label="${lab} 줄이기">−</button><input type="number" inputmode="numeric" min="0" max="999" data-sv="${k}|${f}" value="${v||''}" placeholder="0"><button type="button" data-st="${k}|${f}|1" aria-label="${lab} 늘리기">＋</button></span>`;
       return `<div class="ed-it"><div class="r1"><input data-n="${k}" value="${esc(o.n)}" list="exl2" placeholder="운동 이름"><div class="ops"><button type="button" data-up="${k}" aria-label="위로">▲</button><button type="button" data-dn="${k}" aria-label="아래로">▼</button><button type="button" data-rm="${k}" aria-label="삭제" style="color:var(--bad)">✕</button></div></div>
       <div class="r2">${stp('s',o.s,'세트')}${stp('r',o.r,'횟수')}<select data-u="${k}" aria-label="단위">${['회','초','분'].map(u=>`<option ${o.u===u?'selected':''}>${u}</option>`).join('')}</select><input class="note" data-note="${k}" value="${esc(o.note)}" placeholder="메모 (예: 각 다리, 20kg)"></div></div>`}).join('')||'<div class="muted" style="padding:6px 0">아직 운동이 없어요</div>'}
     <div class="grid2" style="margin-top:6px"><button type="button" class="s" data-add="${di}">＋ 운동 추가</button><button type="button" class="s" data-pick="${di}">📖 사전에서 고르기</button></div></div>`).join('')}
    <datalist id="exl2">${EXDB.map(x=>`<option value="${esc(x.n)}">`).join('')}</datalist>
    <div class="row" style="margin-top:14px"><span style="flex:1"></span><button value="cancel">취소</button><button value="ok" class="p">저장</button></div></form>`;
   const all=s=>dl.querySelectorAll(s),ix=v=>v.split('.').map(Number);
   dl.querySelector('#edBack').onclick=()=>{const ch=JSON.stringify(ED.days)!==ED0;if(ch&&!confirm('바꾼 내용을 저장하지 않고 돌아갈까요?'))return;dl.returnValue='back';dl.close()};
   all('[data-f=name]').forEach(i=>i.oninput=()=>ED.name=i.value);
   all('[data-t]').forEach(i=>i.oninput=()=>ED.days[+i.dataset.t].title=i.value);
   const g=(sel)=>dl.querySelector(sel);
   const setIt=k=>{const[a,b]=ix(k);ED.days[a].items[b]=fmtIt({n:g(`[data-n="${k}"]`).value,s:+g(`[data-sv="${k}|s"]`).value||0,r:+g(`[data-sv="${k}|r"]`).value||0,u:g(`[data-u="${k}"]`).value,note:g(`[data-note="${k}"]`).value.trim()})||g(`[data-n="${k}"]`).value};
   all('[data-n],[data-note]').forEach(i=>i.oninput=()=>setIt(i.dataset.n||i.dataset.note));
   all('[data-u]').forEach(i=>i.onchange=()=>setIt(i.dataset.u));
   all('[data-sv]').forEach(i=>i.oninput=()=>{if(+i.value<0)i.value=0;setIt(i.dataset.sv.split('|')[0])});
   all('[data-st]').forEach(b=>b.onclick=()=>{const[k,f,dv]=b.dataset.st.split('|'),inp=g(`[data-sv="${k}|${f}"]`),u=g(`[data-u="${k}"]`).value,step=f==='r'&&u!=='회'?(u==='초'?5:1):1;inp.value=Math.max(0,(+inp.value||0)+step*(+dv));setIt(k)});
   all('[data-rm]').forEach(b=>b.onclick=()=>{const[a,c]=ix(b.dataset.rm);ED.days[a].items.splice(c,1);draw()});
   all('[data-up],[data-dn]').forEach(b=>b.onclick=()=>{const up=!!b.dataset.up,[a,c]=ix(b.dataset.up||b.dataset.dn),L=ED.days[a].items,j=up?c-1:c+1;if(j<0||j>=L.length)return;[L[c],L[j]]=[L[j],L[c]];draw()});
   all('[data-add]').forEach(b=>b.onclick=()=>{ED.days[+b.dataset.add].items.push('');draw();const L=dl.querySelectorAll(`[data-n^="${b.dataset.add}."]`);L[L.length-1].focus()});
   all('[data-pick]').forEach(b=>b.onclick=()=>pickEx(+b.dataset.pick));
   all('[data-day]').forEach(b=>b.onclick=()=>{const w=b.dataset.day,i=ED.days.findIndex(d=>d.day===w);
     if(i>=0){if(ED.days[i].items.filter(Boolean).length&&!confirm(w+'요일 운동을 빼면 안의 운동도 지워져요. 뺄까요?'))return;ED.days.splice(i,1)}else ED.days.push({day:w,title:'운동',items:[]});draw()})};
  const pickEx=di=>{const pt=ED._pt||'전체';const box=document.createElement('div');box.style.cssText='position:fixed;inset:0;z-index:100;background:var(--card);overflow:auto;padding:16px';
    const pickDraw=()=>{const L=EXDB.filter(x=>(ED._pt||'전체')==='전체'||x.p===ED._pt);
     box.innerHTML=`<div class="backbar"><button type="button" id="pkBack">← 편집으로 돌아가기</button></div><h3>📖 ${esc(ED.days[di].day)} ${esc(ED.days[di].title)}에 추가할 운동</h3><div class="chips">${EXPARTS.map(x=>`<span class="chip ${(ED._pt||'전체')===x?'on':''}" data-pt="${x}">${x}</span>`).join('')}</div>
      <div class="exgrid">${L.map(x=>`<button class="excard" data-ex="${x.id}" type="button"><img src="img/ex/${x.id}_0.jpg" alt="" loading="lazy"><div><b>${esc(x.n)}</b><span>${x.p} · ${esc(x.eq)}</span></div></button>`).join('')}</div>
      <div style="position:sticky;bottom:0;background:var(--card);padding:10px 0"><button class="p" style="width:100%" id="pkDone">완료</button></div>`;
     box.querySelectorAll('[data-pt]').forEach(c=>c.onclick=()=>{ED._pt=c.dataset.pt;pickDraw()});
     box.querySelectorAll('[data-ex]').forEach(c=>c.onclick=()=>{const x=EXDB.find(e=>e.id===c.dataset.ex);const rr=x.p==='유산소'?'20분':x.p==='스트레칭'?'2×30초':'3×10';ED.days[di].items.push(x.n+' '+rr);c.style.outline='3px solid var(--brand)';toast('＋ '+x.n,1200)});
     box.querySelector('#pkDone').onclick=box.querySelector('#pkBack').onclick=()=>{box.remove();draw()}};
    dl.appendChild(box);pickDraw()};
  draw();if(!dl.open)dl.showModal();
  dl.onclose=()=>{if(single&&(dl.returnValue==='back'||dl.returnValue==='cancel')){dl.onclose=null;setTimeout(()=>ACT.woDay({d:single,force:1}),0);return}
    if(dl.returnValue!=='ok'||!dl.querySelector('form'))return;
    ED.days.forEach(d=>d.items=d.items.map(s=>String(s).trim()).filter(Boolean));
    if(single){const ov=LS.get('woOv',{});ov[single]=ED.days[0].items.length?{title:ED.days[0].title||'운동',items:ED.days[0].items}:'skip';LS.set('woOv',ov);savePlans();toast('✅ 이 날 운동을 수정했어요');render();woCalSyncDays([single]);dl.onclose=null;setTimeout(()=>ACT.woDay({d:single,force:1}),0);return}
    if(!ED.name.trim())ED.name='나의 계획';if(!ED.days.length)return toast('운동 요일을 하나 이상 골라 주세요');
    delete ED._pt;const lib=LS.get('plans',[]);if(!ED.id||ED.id.startsWith('__'))ED.id=pid();const i=lib.findIndex(x=>x.id===ED.id);if(i>=0)lib[i]=ED;else lib.unshift(ED);
    if(opt.ai)LS.set('aiPlanDraft',null);
    const act=LS.get('plan',null);
    if(act&&act.id===ED.id){savePlans(lib,Object.assign({},ED,{start:act.start||today(),calIds:act.calIds,calSync:act.calSync,time:act.time}));toast('✅ 적용 중인 계획을 수정했어요 — 스케줄에 바로 반영');woCalSyncDays([...Array(28)].map((_,i)=>addDays(today(),i)))}
    else{savePlans(lib);if(confirm('저장했어요. 이 계획을 지금 적용할까요?')){ACT.usePlan({id:ED.id});return}toast('📂 내 계획에 저장')}
    render()}}

   <div class="row" style="margin-top:14px">${edit!==undefined?'<button value="del" class="x" style="color:var(--bad)">삭제</button>':''}<span style="flex:1"></span><button value="cancel">취소</button><button value="ok" class="p">저장</button></div></form>`;
  dl.showModal();dl.onclose=()=>{const fm=dl.querySelector('form');if(!fm)return;
    if(dl.returnValue==='del'){THM.splice(edit,1);saveThemes();toast('테마를 삭제했어요');render();return}
    if(dl.returnValue!=='ok')return;const n=fm.elements.n.value.trim();if(!n)return toast('테마 이름을 입력해 주세요');
    if(THM.some((x,i)=>x.n===n&&i!==edit))return toast('이미 있는 테마예요');
    const o={n,q:fm.elements.q.value.trim()};if(edit!==undefined)THM[edit]=o;else THM.push(o);saveThemes();toast('★ '+n+' 테마 저장');render()}};
ACT.myTheme=d=>{const i=+d.i,t=THM[i];if(!t)return;const dl=$('#dlg');const rg=LS.get('fregion','');const mine=DB.맛집.filter(x=>String(x.테마||'').split(',').map(s=>s.trim()).includes(t.n));
  dl.innerHTML=`<div style="padding:18px"><h3>★ ${esc(t.n)}</h3><p class="muted" style="margin:0 0 10px">${rg?'📍 '+esc(rg)+' 기준 · ':''}검색어: ${esc(t.q||t.n+' 맛집')}</p>
   <div class="grid2"><a class="btn p" target="_blank" rel="noopener" href="https://map.naver.com/p/search/${encodeURIComponent((rg?rg+' ':'')+(t.q||t.n+' 맛집'))}">네이버 지도</a><a class="btn" target="_blank" rel="noopener" href="https://map.kakao.com/?q=${encodeURIComponent((rg?rg+' ':'')+(t.q||t.n+' 맛집'))}">카카오맵</a></div>
   <h3 style="margin:14px 0 4px">내 목록에서 이 테마 <span class="muted">${mine.length}곳</span></h3>${mine.map(x=>`<div class="drow"><b>${esc(x.이름)}</b><span style="flex:0 0 auto">${esc(x.지역||'')}</span></div>`).join('')||'<p class="muted">맛집 추가 시 테마에 “'+esc(t.n)+'”를 넣으면 여기 모여요.</p>'}
   <div class="row" style="margin-top:12px"><button id="tEdit">수정·삭제</button><button id="tAdd">＋ 이 테마로 맛집 추가</button><span style="flex:1"></span><button class="p" id="tClose">닫기</button></div></div>`;
  dl.showModal();$('#tClose').onclick=()=>{dl.returnValue='';dl.close()};
  $('#tEdit').onclick=()=>{dl.returnValue='';dl.close();setTimeout(()=>ACT.addTheme({},i),0)};
  $('#tAdd').onclick=()=>{dl.returnValue='';dl.close();setTimeout(()=>form('맛집',{테마:t.n}),0)}};
ACT.pick=()=>{const L=DB.맛집;if(!L.length)return toast('먼저 맛집을 추가해 주세요');const x=L[Math.floor(Math.random()*L.length)];$('#pickOut').innerHTML=`<div class="item"><div class="b"><div class="t">🍽 ${esc(x.이름)}</div><div class="d">${esc([x.지역,x.메뉴].filter(Boolean).join(' · '))}</div></div><a class="btn s" target="_blank" href="https://map.naver.com/p/search/${encodeURIComponent((x.지역||'')+' '+x.이름)}">지도</a></div>`};
ACT.swap=()=>{const a=$('#from').value;$('#from').value=$('#to').value;$('#to').value=a};
ACT.toHere=d=>{$('#to').value=d.a;$('#to').scrollIntoView({behavior:'smooth',block:'center'})};
ACT.route=d=>{const f=$('#from').value.trim(),t=$('#to').value.trim();if(!t)return toast('도착지를 입력해 주세요');let u;
  if(d.m==='google')u='https://www.google.com/maps/dir/?api=1&travelmode=transit&destination='+encodeURIComponent(t)+(f?'&origin='+encodeURIComponent(f):'');
  else if(d.m==='kakao')u='https://map.kakao.com/?'+(f?'sName='+encodeURIComponent(f)+'&':'')+'eName='+encodeURIComponent(t);
  else u='https://map.naver.com/p/search/'+encodeURIComponent(t);
  window.open(u,'_blank')};
ACT.pasteUrl=async()=>{let t='';try{t=(await navigator.clipboard.readText()||'').trim()}catch(e){}
  const m=t.match(/https:\/\/script\.google(?:usercontent)?\.com\/[^\s"'<>]+/);
  if(!m){toast('복사된 주소가 없어요. 아래 칸을 길게 눌러 직접 붙여넣고 [연결 테스트 & 저장]을 눌러 주세요',4500);$('#surl').focus();return}
  $('#surl').value=m[0];ACT.connect()};
ACT.connect=async()=>{const u=$('#surl').value.trim().replace(/\s+/g,'');if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u))return toast('script.google.com 으로 시작하는 웹 앱 URL을 넣어 주세요',3500);
  const old=CFG.url;CFG.url=u;toast('연결 확인 중…');
  try{const r=await api('ping',{},30000);setCfg({hasAI:!!r.hasAI,sheetUrl:r.sheetUrl||''});toast('✅ 연결 성공! 데이터를 동기화합니다');
    const local=Object.keys(SHEETS).some(k=>DB[k].length);if(local&&!Q.length&&confirm('이 기기에 있던 기존 데이터를 시트로 올릴까요?'))for(const k in SHEETS)DB[k].forEach(r=>Q.push({action:'upsert',sheet:k,row:r}));
    saveLocal();await sync(true);render()}
  catch(e){CFG.url=old;toast('연결 실패: '+e.message+' — 배포 설정(액세스: 모든 사용자)을 확인하세요',5000)}};
ACT.copyCode=async()=>{try{const t=await (await fetch('Code.gs',{cache:'no-store'})).text();await navigator.clipboard.writeText(t);toast('서버 코드를 복사했어요. Apps Script에 붙여넣으세요!')}catch(e){window.open('Code.gs','_blank')}};
ACT.saveKcal=()=>{setCfg({kcal:$('#kc').value.trim()});toast('저장했어요')};
ACT.login=()=>CLOUD.login();ACT.logout=()=>CLOUD.logout();ACT.cloudPull=()=>CLOUD.pull();
ACT.install=async()=>{if(!window.__bip)return;window.__bip.prompt();try{await window.__bip.userChoice}catch(e){}window.__bip=null;render()};
ACT.exp=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}));a.download='나의하루_백업_'+today()+'.json';a.click()};

ACT.msort=d=>{sub.ms=d.v;render()};
const autoH=t=>{t.style.height='auto';t.style.height=(t.scrollHeight+4)+'px'};
ACT.nmClear=()=>{LS.set('memoDraft',{});['#nmT','#nmC','#nmG'].forEach(x=>$(x).value='');$('#nmP').checked=false};
ACT.nmSave=()=>{const t=$('#nmT').value.trim(),c=$('#nmC').value;if(!t&&!c.trim())return toast('제목이나 내용을 입력해 주세요');
  put('메모',{제목:t||c.trim().split('\n')[0].slice(0,30),내용:c,태그:$('#nmG').value.trim(),고정:$('#nmP').checked});LS.set('memoDraft',{});sub.mopen=0;toast('메모 저장');render()};
function memoPopup(id,edit){const x=DB.메모.find(m=>m.id===id);if(!x)return;const dl=$('#dlg');dl.classList.add('full');
  const pin=x.고정===true||x.고정==='TRUE'||x.고정==='true';
  dl.innerHTML=edit?`<div style="padding:18px"><h3>✏️ 메모 수정</h3><input id="mpT" value="${esc(x.제목)}" placeholder="제목"><textarea id="mpC" class="auto" style="margin-top:8px">${esc(x.내용||'')}</textarea>
    <div class="row" style="margin-top:8px;flex-wrap:nowrap"><input id="mpG" value="${esc(x.태그||'')}" placeholder="태그" style="flex:1"><label style="margin:0;display:flex;gap:6px;align-items:center;color:var(--ink);white-space:nowrap"><input type="checkbox" id="mpP" style="width:auto" ${pin?'checked':''}> 📌 고정</label></div>
    <div class="row bar"><button class="x" id="mpDel" style="color:var(--bad)">🗑 삭제</button><span style="flex:1"></span><button id="mpCancel">취소</button><button class="p" id="mpSave">저장</button></div></div>`
   :`<div style="padding:18px"><h3 style="font-size:20px">${pin?'📌 ':''}${esc(x.제목)}</h3><div class="muted">${esc(x.수정||x.생성||'')}</div>${x.태그?`<div style="margin-top:6px">${String(x.태그).split(',').map(t=>`<span class="tag">${esc(t.trim())}</span>`).join('')}</div>`:''}
    <div class="body">${esc(x.내용||'')||'<span class="muted">(내용 없음)</span>'}</div>
    <div class="row bar"><button class="x" id="mpDel" style="color:var(--bad)">🗑 삭제</button><button id="mpCopy">복사</button><span style="flex:1"></span><button id="mpClose">닫기</button><button class="p" id="mpEdit">✏️ 수정</button></div></div>`;
  if(!dl.open)dl.showModal();dl.onclose=()=>dl.classList.remove('full');
  const q=s=>dl.querySelector(s),close=()=>{dl.returnValue='';dl.close()};
  if(q('#mpC')){autoH(q('#mpC'));q('#mpC').oninput=e=>autoH(e.target)}
  q('#mpDel').onclick=()=>{if(!confirm(`‘${x.제목}’ 메모를 삭제할까요?`))return;close();del('메모',x.id);toast('삭제했어요');render()};
  if(q('#mpClose'))q('#mpClose').onclick=close;
  if(q('#mpEdit'))q('#mpEdit').onclick=()=>memoPopup(id,1);
  if(q('#mpCopy'))q('#mpCopy').onclick=async()=>{try{await navigator.clipboard.writeText((x.제목?x.제목+'\n':'')+(x.내용||''));toast('복사했어요')}catch(e){toast('복사하지 못했어요')}};
  if(q('#mpCancel'))q('#mpCancel').onclick=()=>memoPopup(id,0);
  if(q('#mpSave'))q('#mpSave').onclick=()=>{put('메모',Object.assign({},x,{제목:q('#mpT').value.trim()||'(제목 없음)',내용:q('#mpC').value,태그:q('#mpG').value.trim(),고정:q('#mpP').checked}));toast('저장했어요');render();memoPopup(id,0)}}
ACT.detail=d=>{const x=DB.맛집.find(r=>r.id===d.id);if(!x)return;const dl=$('#dlg');
  const rows=[['업체명',x.이름],['지역',x.지역],['추천 메뉴',x.메뉴],['테마',x.테마],['평점',x.평점],['가격대',x.가격대],['방문',x.방문],['메모',x.메모]].filter(r=>r[1]);
  const ph=LS.get('fphoto',{})[x.id];
  dl.innerHTML=`<div class="dhead">${ph?`<img src="${ph}" alt="">`:x.메뉴?dishImg(String(x.메뉴).split(/[,\s]/)[0]):phImg('store')}<h3>${esc(x.이름)}</h3></div><div style="padding:6px 18px 4px">${rows.map(([k,v])=>`<div class="drow"><span>${k}</span><b style="white-space:pre-wrap">${esc(v)}</b></div>`).join('')}</div><div class="row" style="padding:12px 18px 18px"><a class="btn" target="_blank" rel="noopener" href="https://map.naver.com/p/search/${encodeURIComponent((x.지역||'')+' '+x.이름)}">지도</a><button class="x" id="dDel" style="color:var(--bad)">🗑 삭제</button><span style="flex:1"></span><button id="dClose">닫기</button><button class="p" id="dEdit">수정</button></div>`;
  dl.showModal();fillImgs(dl);fillPhotos(dl);
  $('#dClose').onclick=()=>{dl.returnValue='';dl.close()};
  $('#dEdit').onclick=()=>{dl.returnValue='';dl.close();setTimeout(()=>form('맛집',x),0)};
  $('#dDel').onclick=()=>{if(!confirm(`‘${x.이름}’을(를) 삭제할까요?`))return;dl.returnValue='';dl.close();del('맛집',x.id);const P=LS.get('fphoto',{});delete P[x.id];LS.set('fphoto',P);toast('삭제했어요');render()};
};
ACT.tv=()=>{const dl=$('#dlg');const S=['테이스티로드','식신로드','수요미식회','생생정보통','VJ특공대','생활의달인','맛있는TV','올리브쇼'];
  dl.innerHTML=`<div style="padding:18px"><h3>TV맛집</h3><p class="muted" style="margin:0 0 6px">TV에 나온 맛집을 방송 프로그램별로 지도에서 검색해요.</p>${S.map(n=>`<a class="drow" target="_blank" rel="noopener" href="https://map.naver.com/p/search/${encodeURIComponent(n+' 맛집')}" style="text-decoration:none;color:var(--ink)"><span style="color:var(--ink)">${n}</span><b style="flex:0">›</b></a>`).join('')}<div class="row" style="margin-top:12px"><span style="flex:1"></span><button class="p" id="tvClose">닫기</button></div></div>`;
  dl.showModal();$('#tvClose').onclick=()=>{dl.returnValue='';dl.close()}};

/* ===================== 시작 ===================== */
if(!TABS.some(x=>x[0]===tab))tab='home';
render();sync(true);CLOUD.init();
addEventListener('online',()=>sync(false));
addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__bip=e;if(tab==='home'||tab==='more')render()});
addEventListener('appinstalled',()=>{window.__bip=null;toast('앱이 설치됐어요! 홈 화면에서 열어 보세요');render()});
let lastVis=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(CFG.url)sync(true);else if(CLOUD.user&&Date.now()-lastVis>30000){lastVis=Date.now();CLOUD.pull()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
