<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나의 하루</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#1c1f1e;--sub:#6b716e;--line:#e4e7e4;--brand:#0f766e;--brand2:#e6f4f1;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--r:16px;--onbrand:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#111413;--card:#1a1e1d;--ink:#eef1ef;--sub:#9aa29e;--line:#2a302e;--brand:#2dd4bf;--brand2:#13302c;--warn:#fbbf24;--warnbg:#3a2e10;--bad:#f87171;--onbrand:#04201c}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:8px}
header h1{font-size:20px;margin:0;flex:1}
#sync{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--card);cursor:pointer}
main{padding:4px 16px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav.tabs button{flex:1;border:0;background:none;color:var(--sub);padding:8px 0 10px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.tabs button .i{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--brand);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.card h2 .sp{flex:1}
.muted{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{padding:10px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.item:first-of-type{border-top:0}
.item .b{flex:1;min-width:0}
.item .t{font-weight:600;word-break:break-all}
.item .d{color:var(--sub);font-size:13px;white-space:pre-wrap;word-break:break-all}
button,.btn{font:inherit;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px;justify-content:center}
button.p,.btn.p{background:var(--brand);border-color:var(--brand);color:var(--onbrand);font-weight:600}
button.s{padding:5px 10px;font-size:13px;border-radius:10px}
button.x{border:0;background:none;color:var(--sub);padding:4px 6px}
input,textarea,select{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;color:var(--sub);display:block;margin:8px 0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chip{white-space:nowrap;border-radius:99px;padding:6px 12px;font-size:13px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.chip.on{background:var(--brand2);border-color:var(--brand);color:var(--brand);font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--brand2);color:var(--brand);margin-right:4px}
.tag.w{background:var(--warnbg);color:var(--warn)}
.big{font-size:28px;font-weight:800}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--brand);color:var(--onbrand);font-size:28px;border:0;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:8}
dialog{border:0;border-radius:20px;padding:0;width:min(560px,94vw);background:var(--card);color:var(--ink);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog form{padding:18px}
dialog h3{margin:0 0 6px}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:6px}
.bars div{flex:1;background:var(--brand2);border-radius:6px 6px 0 0;position:relative;min-height:2px}
.bars div.on{background:var(--brand)}
.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--sub)}
.notice{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:#1c1f1e;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;max-width:90vw}
.steps li{margin:6px 0}
code{background:var(--brand2);padding:1px 5px;border-radius:6px;font-size:13px}
.thumb{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:8px}
.hide{display:none!important}
.sec{display:none}.sec.on{display:block}
.empty{color:var(--sub);text-align:center;padding:14px;font-size:14px}
:root[data-topic=fit]{--bg:#0b1020;--card:#151c33;--ink:#f3f6ff;--sub:#aab4d4;--line:#2a3560;--brand:#538DFF;--brand2:#1c2a55;--onbrand:#0b1020;--warn:#fbbf24;--warnbg:#3a2e10;--bad:#f87171}
:root[data-topic=cook]{--bg:#fffaf4;--card:#fff;--ink:#2b1d14;--sub:#7a6555;--line:#f0dcc8;--brand:#c2410c;--brand2:#ffe9d6;--onbrand:#fff;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c}
:root[data-topic=food]{--bg:#fbf7f5;--card:#fff;--ink:#2a1616;--sub:#6b4f4a;--line:#ecdcd6;--brand:#b91c1c;--brand2:#fde8e8;--onbrand:#fff;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c}
:root[data-topic=memo]{--bg:#fffdf5;--card:#fff;--ink:#26210f;--sub:#6b6241;--line:#eadf9c;--brand:#854d0e;--brand2:#fde68a;--onbrand:#fff;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c}
nav.tabs button svg{width:24px;height:24px}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tcard{padding:0;overflow:hidden;display:block;text-align:left;border-radius:var(--r)}
.tcard img{width:100%;height:96px;object-fit:cover;display:block}
.tcard div{padding:10px 12px}.tcard b{display:block;font-size:16px}.tcard span{font-size:12px;color:var(--sub)}
.banner{display:block;width:100%;height:150px;object-fit:cover;border-radius:18px;margin:10px 0 6px}
.big2{font-size:24px;margin:8px 0 6px;letter-spacing:-.4px}
.hero h2{font-size:26px;line-height:1.3;margin:6px 0 0;letter-spacing:-.4px}
.hero img{display:block;width:100%;height:170px;object-fit:cover;border-radius:18px;margin-top:12px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.stats3 b{display:block;font-size:22px;color:var(--brand)}.stats3 span{font-size:12px;color:var(--sub)}
.rail{display:flex;gap:10px;overflow-x:auto;padding:2px 0 8px}
.rcard{flex:0 0 190px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rcard img{display:block;width:100%;height:110px;object-fit:cover}.rcard .rb{padding:10px 12px 12px}
.th{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:0 0 auto}
.rk{width:24px;font-size:20px;font-weight:800;color:var(--brand);text-align:center}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0}
.cats a{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink);text-decoration:none}
.cats i{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:18px}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:8px 0 12px;border-radius:12px;overflow:hidden}
.tile{min-height:78px;background:var(--card);border:0;border-radius:0;display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--ink);text-decoration:none;padding:6px}
.tile svg{width:26px;height:26px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer}
.pcard img{display:block;width:100%;height:110px;object-fit:cover}.pcard .pb{padding:10px 12px 12px}
.pcard .t{font-weight:700;word-break:break-all}.pcard .d{font-size:12px;color:var(--sub);white-space:pre-line}
.pcard .st{margin-top:4px;color:var(--brand);font-size:13px;letter-spacing:1px}.pcard .st span{color:var(--sub);letter-spacing:0;font-size:12px}
.seg{display:flex;background:var(--brand2);border-radius:99px;padding:3px}
.seg span{padding:6px 12px;border-radius:99px;font-size:12px;cursor:pointer;color:var(--sub)}
.seg span.on{background:var(--card);color:var(--ink);font-weight:700}
.sq{width:36px;height:36px;border-radius:10px;flex:0 0 auto}
.dhead img{display:block;width:100%;height:180px;object-fit:cover}.dhead h3{margin:12px 18px 0;font-size:20px}
.drow{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;justify-content:space-between}
.drow span{color:var(--sub);flex:0 0 72px}.drow b{flex:1;font-weight:600}
.rmres{margin:12px 0;padding:12px;border-radius:12px;background:var(--bg);display:flex;justify-content:space-between;align-items:baseline}
.rmres b{font-size:22px;color:var(--brand)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{background:var(--bg);border-radius:12px;padding:10px 6px;text-align:center}
.cell span,.cell small{display:block;font-size:12px;color:var(--sub)}.cell b{font-size:18px;color:var(--brand)}
.pill{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--card);cursor:pointer;white-space:nowrap}#acct:empty{display:none}#acct.go{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.hero{background:linear-gradient(135deg,var(--brand2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:10px 0}.hero b{font-size:16px}.hero p{margin:6px 0 12px;color:var(--sub);font-size:13px}
.exgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.excard{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:block;color:var(--ink)}
.excard img{display:block;width:100%;height:104px;object-fit:cover;background:#ddd}.excard div{padding:8px 10px 10px}.excard b{display:block;font-size:14px;line-height:1.3}.excard span{font-size:11px;color:var(--sub)}
.flip{position:relative;width:100%;aspect-ratio:3/2;border-radius:14px;overflow:hidden;background:#ddd}
.flip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.flip img.b{animation:flip 2.4s steps(1) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
.flip i{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-style:normal;font-size:11px;padding:2px 8px;border-radius:99px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.pair figure{margin:0;font-size:11px;color:var(--sub);text-align:center}.pair img{width:100%;border-radius:10px;display:block}
ol.num{padding-left:0;list-style:none;counter-reset:n;margin:8px 0}ol.num li{counter-increment:n;position:relative;padding:8px 0 8px 36px;border-top:1px solid var(--line)}ol.num li:first-child{border-top:0}
ol.num li::before{content:counter(n);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--onbrand);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.dimg{width:100%;height:170px;object-fit:cover;display:block;background:var(--brand2)}
.rcp{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.rcp:first-child{border-top:0}
.rcp img{width:68px;height:68px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:var(--brand2)}
.ok{color:#15803d}.no{color:var(--bad)}
.tile.my{background:var(--brand2);color:var(--brand)}.tile.add{color:var(--sub);border:0}
.kind{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.kind label{margin:0;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:12px;border:2px solid var(--line);font-weight:700;color:var(--sub);cursor:pointer;font-size:15px}
.kind input{display:none}.kind label.on.pub{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}.kind label.on.pri{border-color:#db2777;background:#fdf2f8;color:#be185d}
.tag.pub{background:#dbeafe;color:#1d4ed8}.tag.pri{background:#fce7f3;color:#be185d}.tag.unk{background:var(--line);color:var(--sub)}
.sech{display:flex;align-items:center;gap:8px;margin:18px 0 4px;font-size:17px;font-weight:800}.sech .bar{width:6px;height:20px;border-radius:3px}
.card.pub{border-left:5px solid #2563eb}.card.pri{border-left:5px solid #db2777}.card.unk{border-left:5px solid var(--line)}
.addrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:8px 0}.addrow button{min-height:48px;font-weight:700}
.b-pub{background:#2563eb!important;border-color:#2563eb!important;color:#fff!important}.b-pri{background:#db2777!important;border-color:#db2777!important;color:#fff!important}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.sum3 div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.sum3 b{display:block;font-size:20px}.sum3 span{font-size:12px;color:var(--sub)}
@media (prefers-color-scheme:dark){.kind label.on.pub{background:#172554;color:#93c5fd}.kind label.on.pri{background:#3b0a24;color:#f9a8d4}.tag.pub{background:#172554;color:#93c5fd}.tag.pri{background:#3b0a24;color:#f9a8d4}}
.gbtn{width:100%;background:#fff;color:#1f1f1f;border:1px solid #dadce0;font-weight:600;gap:10px}.gbtn svg{width:18px;height:18px}
</style>
</head>
<body>
<header><h1 id="title">오늘</h1><span id="acct" class="pill" title="Google 계정"></span><span id="sync" class="pill" title="동기화">로컬 모드</span></header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<dialog id="dlg"></dialog>

<script src="ex.js"></script>
<script src="recipes.js"></script>
<script>
/* ===================== 기본 ===================== */
const TABS=[['home','M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z','홈'],['plan','M4 6h16v14H4zM4 10h16M8 3v4M16 3v4','일정'],['cook','M3 11h18a9 7 0 0 1-18 0zM8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4','요리'],['fit','M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12','운동'],['more','M4 6h16M4 12h16M4 18h16','더보기']];
const svgI=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const SHEETS={메모:['제목','내용','태그','고정'],일정:['구분','종류','제목','날짜','시작','종료','장소','상대','메모','캘린더ID'],맛집:['이름','지역','메뉴','테마','평점','가격대','방문','메모'],장소:['이름','주소','종류'],식재료:['이름','수량','보관','유통기한'],레시피:['이름','재료','조리법','칼로리','시간','출처'],운동:['날짜','종류','부위','세트시간','칼로리','메모'],식단:['날짜','끼니','음식','칼로리','메모']};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const addDays=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dname=s=>{const d=new Date(s+'T00:00');return (d.getMonth()+1)+'/'+d.getDate()+' ('+'일월화수목금토'[d.getDay()]+')'};
const uid=()=>Math.random().toString(36).slice(2,10);
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.]/g,''));return isNaN(n)?0:n};
function toast(m,ms=2400){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}

const LS={get(k,d){try{const v=localStorage.getItem('life.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('life.'+k,JSON.stringify(v))}catch(e){}}};
let DB=LS.get('db',{});for(const k in SHEETS)DB[k]=DB[k]||[];
let Q=LS.get('queue',[]);
let CFG=LS.get('cfg',{url:'',kcal:'',hasAI:false,sheetUrl:''});
let CAL=LS.get('cal',[]);
let tab=location.hash.slice(1)||'home', sub=LS.get('sub',{}), SCR={};
let CK=LS.get('cook',{q:'',fridge:null,sel:[],busy:{}});CK.busy={};const saveCK=()=>LS.set('cook',CK);
let THM=LS.get('themes',[]),THM_AT=LS.get('themesAt',0);
let DEL=LS.get('del',{});
const saveLocal=()=>{LS.set('db',DB);LS.set('queue',Q);LS.set('del',DEL);CLOUD.dirty()};

/* ===================== Google 로그인 · 클라우드 (여행 플래너와 같은 Firebase) =====================
   - users/{내uid}/life/state 문서에 설정(서버 주소·목표 칼로리·운동 계획)과 데이터를 저장
   - 보안 규칙: 로그인한 본인만 읽기/쓰기 (firestore.rules)
   - 서버 주소를 한 기기에서만 넣으면, 다른 기기는 로그인만 하면 자동으로 받아옴 */
const FB_VER='10.12.2';
function loadScript(src){return new Promise((ok,no)=>{if(document.querySelector(`script[src="${src}"]`))return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
const CLOUD={auth:null,db:null,user:null,ready:false,failed:false,t:null,busy:false,
  async init(){
    try{
      await loadScript('../firebase-config.js');
      if(!window.FIREBASE_CONFIG||!window.FIREBASE_CONFIG.apiKey)throw new Error('no config');
      for(const m of ['app','auth','firestore'])await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-${m}-compat.js`);
      const fb=window.firebase;if(!fb.apps.length)fb.initializeApp(window.FIREBASE_CONFIG);
      this.auth=fb.auth();this.db=fb.firestore();
      try{await this.auth.setPersistence(fb.auth.Auth.Persistence.LOCAL)}catch(e){}
      try{await this.auth.getRedirectResult()}catch(e){}
      this.auth.onAuthStateChanged(async u=>{this.user=u;this.ready=true;paintAcct();if(u){await this.pull();}render()});
    }catch(e){this.failed=true;this.ready=true;paintAcct();console.warn('cloud',e)}
  },
  async login(){
    if(!this.auth){toast(this.failed?'로그인 기능을 불러오지 못했어요. 인터넷 연결을 확인해 주세요':'잠시 후 다시 눌러 주세요');return}

function mergeData(R,RD){

  }
}

async function api(action,body={},timeout=60000){
  if(!CFG.url)throw new Error('서버 미연결');
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),timeout);
  try{
    const r=await fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...body}),signal:ctl.signal});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'서버 오류');return j.data===undefined?j:j.data;
  }finally{clearTimeout(tm)}
}
function setSync(t){$('#sync').textContent=t}
let syncing=false;
async function sync(full=true){
  if(!CFG.url){if(CLOUD.user)CLOUD.dirty();else setSync(CLOUD.ready?'로컬 모드':'…');return}
  if(syncing)return;syncing=true;setSync('동기화 중…');
  try{
    if(Q.length){
      const ops=Q.slice(0,40);const res=await api('batch',{ops});
      res.forEach((r,i)=>{if(r.ok&&ops[i].action==='upsert'){const L=DB[ops[i].sheet];const k=L.findIndex(x=>x.id===r.data.id);if(k>=0)L[k]=Object.assign(L[k],r.data)}});
      Q=Q.slice(ops.length);saveLocal();
      if(Q.length){syncing=false;return sync(full)}
    }
    if(full){
      const d=await api('listAll');for(const k in SHEETS)DB[k]=d[k]||[];saveLocal();
      try{CAL=await api('calList',{from:addDays(today(),-7),to:addDays(today(),45)});LS.set('cal',CAL)}catch(e){}
    }
    setSync('✓ 동기화 '+new Date().toTimeString().slice(0,5));render();
  }catch(e){setSync(Q.length?'⏳ 대기 '+Q.length+'건':'오프라인');console.warn(e)}
  syncing=false;
}
function put(sheet,row){
  row=Object.assign({},row);if(!row.id)row.id=uid();
  const now=new Date().toISOString().slice(0,16).replace('T',' ');if(!row['생성'])row['생성']=now;row['수정']=now;row._t=Date.now();
  const L=DB[sheet];const k=L.findIndex(x=>x.id===row.id);if(k>=0)L[k]=Object.assign(L[k],row);else L.push(row);
  Q=Q.filter(o=>!(o.action==='upsert'&&o.sheet===sheet&&o.row.id===row.id));Q.push({action:'upsert',sheet,row});saveLocal();sync(false);return row;
}
function del(sheet,id){
  DB[sheet]=DB[sheet].filter(x=>x.id!==id);(DEL[sheet]=DEL[sheet]||{})[id]=Date.now();Q=Q.filter(o=>!(o.sheet===sheet&&o.row&&o.row.id===id));Q.push({action:'remove',sheet,id});saveLocal();sync(false);
}
async function ai(prompt,image,mime){
  if(!CFG.url)throw new Error('AI 기능은 서버 연결 후 사용할 수 있어요 (더보기 → 설정).');
  const waits=[4000,10000,20000];
  for(let i=0;;i++){
    try{return await api('ai',{prompt,image,mime},120000)}
    catch(e){
      const busy=/\((500|503)|high demand|overloaded|UNAVAILABLE/i.test(e.message);
      if(!busy||i>=waits.length)throw new Error(busy?'지금 구글 AI 서버가 붐벼요(일시적). 1~2분 뒤 다시 눌러 주세요.':e.message);
      toast(`AI 서버가 붐벼서 ${waits[i]/1000}초 뒤 자동 재시도할게요 (${i+1}/${waits.length})`,waits[i]);
      await new Promise(r=>setTimeout(r,waits[i]));
    }
  }
}
function imgToB64(file,max=1024){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',.82);ok({b64:u.split(',')[1],url:u})};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}

/* ---- 일정 (공적 · 사적 분리) ---- */
const KIND_RE=/^\s*\[(공적|사적)\]\s*/;
function kindOf(x){if(x.구분==='공적'||x.구분==='사적')return x.구분;const m=String(x.제목||'').match(KIND_RE);return m?m[1]:'미분류'}
function kindTag(g){return g==='공적'?'<span class="tag pub">💼 공적</span>':g==='사적'?'<span class="tag pri">🏠 사적</span>':'<span class="tag unk">미분류</span>'}
function calRows(){return CAL.filter(x=>!DB.일정.some(y=>y['캘린더ID']===x.eventId)).map(x=>{const m=String(x.title||'').match(KIND_RE);return {제목:String(x.title||'').replace(KIND_RE,''),구분:m?m[1]:'',날짜:x.date,시작:x.start,장소:x.location,종류:'캘린더',_cal:1}})}
function planList(rows,mode,t){
  if(mode==='약속')rows=rows.filter(x=>x.종류==='약속');
  rows=mode==='지난'?rows.filter(x=>x.날짜<t).sort((a,b)=>b.날짜.localeCompare(a.날짜)):rows.filter(x=>x.날짜>=t).sort((a,b)=>(a.날짜+(a.시작||'')).localeCompare(b.날짜+(b.시작||'')));
  return rows;
}
function planCards(rows,t,cls){
  const g={};rows.forEach(x=>(g[x.날짜]=g[x.날짜]||[]).push(x));
  return Object.keys(g).slice(0,60).map(dt=>`<div class="card ${cls}"><h2>${dname(dt)}${dt===t?' <span class="tag">오늘</span>':''}</h2>${g[dt].map(x=>`<div class="item" ${x._cal?'':`data-ed="일정|${x.id}"`}><div class="muted" style="width:46px">${x.시작||'종일'}</div><div class="b"><div class="t">${esc(x.제목)}</div><div class="d">${esc([x.장소,x.상대&&(kindOf(x)==='공적'?'참석: ':'with ')+x.상대].filter(Boolean).join(' · '))}</div></div>${x.종류==='약속'?'<span class="tag w">약속</span>':''}${x._cal?'<span class="tag">캘린더</span>':x['캘린더ID']?'<span class="tag">☁︎</span>':''}</div>`).join('')}</div>`).join('');
}

const FOOD=['img/food-jeyuk.svg','img/food-stew.svg','img/food-rice.svg','img/food-egg.svg'];
const REST=['img/rest-grill.svg','img/rest-noodle.svg','img/rest-sushi.svg'];
const q10=q=>'https://www.10000recipe.com/recipe/list.html?q='+encodeURIComponent(q);
const fb=n=>FOOD[[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)%4];
/* 요리 사진: 위키백과 대표 이미지(무료 공개 API) → 없으면 일러스트. 결과는 기기에 저장 */
const DIMG=LS.get('dimg',{});
async function wikiImg(name){
  const key=String(name).trim();if(key in DIMG)return DIMG[key];
  const api=q=>fetch('https://ko.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=480&redirects=1&'+q).then(r=>r.json());
  let u='';
  try{
    let j=await api('titles='+encodeURIComponent(key));let pg=Object.values((j.query||{}).pages||{})[0]||{};u=(pg.thumbnail||{}).source||'';
    if(!u){j=await api('generator=search&gsrlimit=1&gsrsearch='+encodeURIComponent(key));pg=Object.values((j.query||{}).pages||{})[0]||{};
      const tt=String(pg.title||'');if(tt&&(key.includes(tt)||tt.includes(key)))u=(pg.thumbnail||{}).source||''}
  }catch(e){return ''}
  DIMG[key]=u;LS.set('dimg',DIMG);return u;
}
function fillImgs(root=document){root.querySelectorAll('img[data-dish]').forEach(async im=>{const u=await wikiImg(im.dataset.dish);if(u&&im.isConnected){im.src=u;im.title='사진: 위키백과'}})}
const dishImg=(n,cls='')=>`<img ${cls?`class="${cls}"`:''} src="${fb(n)}" data-dish="${esc(n)}" alt="${esc(n)}" loading="lazy">`;
const myIng=()=>DB.식재료.map(x=>String(x.이름).trim()).filter(Boolean);
const hasIng=(list,w)=>list.some(x=>x.includes(w)||w.includes(x));
function matchRecipes(have){
  return RECIPES.map(r=>{const okM=r.main.filter(w=>hasIng(have,w)),okO=r.opt.filter(w=>hasIng(have,w));
    return {r,okM,okO,miss:r.main.filter(w=>!hasIng(have,w)),score:okM.length*3+okO.length-(r.main.length-okM.length)*4}})
   .filter(x=>x.okM.length||x.okO.length>=2).sort((a,b)=>b.score-a.score);
}

   <button class="s" data-act="ccat" data-v="__all" style="width:100%;margin-top:8px">전체 보기</button></div>`;

function dishCard(d,i,src){return `<div class="rcp" data-act="recipe" data-k="${src}|${i}">${dishImg(d.name)}<div class="b"><div class="t">${esc(d.name)} ${d.lowcal?'<span class="tag">저칼로리</span>':''}</div><div class="muted">${esc(d.why||'')}</div><div class="muted">⏱ ${esc(d.minutes||'?')}분 · 약 ${esc(d.kcal||'?')}kcal(추정)${d.missing&&d.missing.length?' · <span class="no">+'+d.missing.length+'개 필요</span>':''}</div></div><span class="muted">›</span></div>`}

  }else if(m==='교통'){
    const P=DB.장소;const opts=P.map(x=>`<option value="${esc(x.주소||x.이름)}">${esc(x.이름)}</option>`).join('');
    h+=`<div class="card"><h2>🚇 길찾기</h2><label>출발</label><input id="from" list="pl" placeholder="장소명 또는 주소 (비우면 현재 위치)"><label>도착</label><input id="to" list="pl" placeholder="장소명 또는 주소"><datalist id="pl">${opts}</datalist>
     <div class="grid2" style="margin-top:12px"><button class="p" data-act="route" data-m="kakao">카카오맵</button><button class="p" data-act="route" data-m="google">구글 대중교통</button><button data-act="route" data-m="naver">네이버 지도</button><button data-act="swap">⇅ 출발/도착 바꾸기</button></div></div>
    <div class="card"><h2>⭐ 자주 가는 곳<span class="sp"></span><button class="s" data-act="add" data-s="장소">＋</button></h2>${P.length?P.map(x=>`<div class="item"><div class="b" data-ed="장소|${x.id}"><div class="t">${esc(x.이름)} <span class="tag">${esc(x.종류||'')}</span></div><div class="d">${esc(x.주소||'')}</div></div><button class="s" data-act="toHere" data-a="${esc(x.주소||x.이름)}">여기로</button></div>`).join(''):'<div class="empty">집·회사 등을 등록하면 한 번에 길찾기 돼요</div>'}</div>`;
  }else{
    h+=`${CLOUD.user?`<div class="card"><h2>👤 내 계정</h2><p class="muted" style="margin:0 0 10px">${esc(CLOUD.user.email||'')} — 설정과 데이터가 이 계정에 저장돼 모든 기기에서 같이 보여요.</p><div class="row"><button data-act="cloudPull">☁︎ 지금 동기화</button><button class="x" data-act="logout">로그아웃</button></div></div>`:loginCard()}
    ${installCard()}
    <div class="card"><h2>⚙️ 서버 연결 (구글 시트·캘린더·AI)</h2>
     <p class="muted">${CFG.url?'✅ 연결됨'+(CLOUD.user?' · 내 계정에 저장됨(다른 기기 자동 연결)':''):(CLOUD.user?'❌ 미연결 — 아래 [1분 연결 방법]대로 주소를 한 번만 붙여넣으면 내 계정에 저장돼 모든 기기가 자동 연결돼요':'❌ 미연결 — 먼저 Google 로그인을 해 주세요 (주소가 계정에 저장돼요)')} ${CFG.url?(CFG.hasAI?'· AI 사용 가능':'· AI 키 없음(시트 설정 탭 B2)'):''}</p>
     <details ${CFG.url?'':'open'} style="margin:8px 0"><summary><b>1분 연결 방법 (PC 권장, 평생 1번)</b></summary><ol class="steps">
      <li><a class="btn s" target="_blank" rel="noopener" href="https://script.google.com/home">Apps Script 열기</a> → 목록에서 <b>「나만의 생활 대시보드 DB」</b>에 붙은 프로젝트 클릭 (이름이 <b>제목 없는 프로젝트</b>일 수 있어요)</li>
      <li>오른쪽 위 <b>배포 → 배포 관리</b> → <b>웹 앱 URL</b> 옆 <b>복사</b></li>
      <li>이 앱으로 돌아와 아래 <b>[📋 붙여넣고 연결]</b> 누르기 — 끝!</li></ol>
      <p class="muted">배포 관리에 아무것도 없다면: <b>배포 → 새 배포 → ⚙️ 웹 앱</b> → 실행: <b>나</b>, 액세스: <b>모든 사용자</b> → 배포 → 권한 허용 후 URL 복사.</p></details>
     <button class="p" data-act="pasteUrl" style="width:100%;margin-bottom:8px">📋 붙여넣고 연결</button>
     <label>Apps Script 웹 앱 URL</label><input id="surl" value="${esc(CFG.url)}" placeholder="https://script.google.com/macros/s/…/exec">
     <div class="row" style="margin-top:8px"><button class="p" data-act="connect">연결 테스트 & 저장</button>${CFG.sheetUrl?`<a class="btn" target="_blank" href="${esc(CFG.sheetUrl)}">시트 열기</a>`:''}</div>
     <details style="margin-top:10px"><summary><b>처음 설정 방법 (약 5분, 한 번만)</b></summary><ol class="steps">
      <li>구글 드라이브에서 <b>「나만의 생활 대시보드 DB」</b> 시트를 엽니다 (이미 만들어 두었어요).</li>
      <li>메뉴 <b>확장 프로그램 → Apps Script</b> 클릭.</li>
      <li>편집기의 내용을 모두 지우고, 아래 <b>[서버 코드 복사]</b> 버튼으로 복사한 코드를 붙여넣고 💾 저장.</li>
      <li>오른쪽 위 <b>배포 → 새 배포</b> → 톱니바퀴에서 <b>웹 앱</b> 선택 → 실행 사용자: <b>나</b>, 액세스: <b>모든 사용자</b> → 배포.</li>
      <li>권한 창이 뜨면 계정 선택 → <b>고급 → (안전하지 않음)으로 이동 → 허용</b>.</li>
      <li>나온 <b>웹 앱 URL</b>을 복사해서 위 칸에 붙여넣고 [연결 테스트 & 저장].</li>
      <li>(AI 사용 시) <a target="_blank" href="https://aistudio.google.com/apikey">Google AI Studio</a>에서 API 키 발급 → 시트 <b>설정</b> 탭 <b>B2</b> 칸에 붙여넣기.</li></ol>
      <button data-act="copyCode">📋 서버 코드 복사</button></details></div>
    <div class="card"><h2>🎯 하루 목표 칼로리</h2><div class="row"><input id="kc" type="number" value="${esc(CFG.kcal)}" placeholder="예: 직접 정한 목표" style="flex:1"><button data-act="saveKcal">저장</button></div></div>
    <div class="card"><h2>💾 백업</h2><div class="row"><button data-act="exp">내보내기(JSON)</button><label class="btn" style="margin:0">가져오기<input type="file" id="impIn" accept=".json" class="hide"></label></div><p class="muted">서버 연결 시 모든 데이터는 구글 시트에도 저장돼요. 대기 중 ${Q.length}건.</p></div>
    <p class="muted" style="text-align:center">나의 하루 v1.3 · 무료 도구만 사용 (GitHub Pages · Google Apps Script · Gemini 무료 등급)</p>`;
  }
  return h;
};
AFTER.more=()=>{const fr=$('#freg');if(fr)fr.onchange=()=>{LS.set('fregion',fr.value.trim());render()};const fq=$('#fq');if(fq){fq.oninput=()=>{sub.fq=fq.value;const p=fq.selectionStart;render();const n=$('#fq');n.focus();n.setSelectionRange(p,p)}}
  const q=$('#mq');if(q){q.oninput=()=>{sub.mq=q.value;const p=q.selectionStart;render();const n=$('#mq');n.focus();n.setSelectionRange(p,p)}}
  const im=$('#impIn');if(im)im.onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());if(!confirm('가져온 데이터를 추가할까요? (같은 id는 덮어씀)'))return;for(const k in SHEETS)(d[k]||[]).forEach(r=>put(k,r));toast('가져오기 완료');render()}catch(er){toast('파일을 읽지 못했어요')}}};
function allThemes(){return [...new Set([...THM.map(t=>t.n),'가족모임','데이트','친구 모임','회식','혼밥','비오는 날','드라이브','건강식','가성비'])]}
function saveThemes(){THM_AT=Date.now();LS.set('themes',THM);LS.set('themesAt',THM_AT);CLOUD.saveCfg()}
ACT.addTheme=(d,edit)=>{const dl=$('#dlg'),t=edit!==undefined?THM[edit]:{n:'',q:''};
  dl.innerHTML=`<form method="dialog"><h3>${edit!==undefined?'내 테마 수정':'★ 내 테마 추가'}</h3><p class="muted" style="margin:0">예: 회식, 혼밥, 노포, 반려견 동반, 브런치, 야장…</p>
   <label>테마 이름</label><input name="n" value="${esc(t.n)}" placeholder="예: 회식 장소" maxlength="12">
   <label>지도 검색어 (선택)</label><input name="q" value="${esc(t.q||'')}" placeholder="비우면 테마 이름 + 맛집으로 검색">
   <div class="row" style="margin-top:14px">${edit!==undefined?'<button value="del" class="x" style="color:var(--bad)">삭제</button>':''}<span style="flex:1"></span><button value="cancel">취소</button><button value="ok" class="p">저장</button></div></form>`;
  dl.showModal();dl.onclose=()=>{const fm=dl.querySelector('form');if(!fm)return;
    if(dl.returnValue==='del'){THM.splice(edit,1);saveThemes();toast('테마를 삭제했어요');render();return}
    if(dl.returnValue!=='ok')return;const n=fm.elements.n.value.trim();if(!n)return toast('테마 이름을 입력해 주세요');
    if(THM.some((x,i)=>x.n===n&&i!==edit))return toast('이미 있는 테마예요');
    const o={n,q:fm.elements.q.value.trim()};if(edit!==undefined)THM[edit]=o;else THM.push(o);saveThemes();toast('★ '+n+' 테마 저장');render()}};
ACT.myTheme=d=>{const i=+d.i,t=THM[i];if(!t)return;const dl=$('#dlg');const rg=LS.get('fregion','');const mine=DB.맛집.filter(x=>String(x.테마||'').split(',').map(s=>s.trim()).includes(t.n));
  dl.innerHTML=`<div style="padding:18px"><h3>★ ${esc(t.n)}</h3><p class="muted" style="margin:0 0 10px">${rg?'📍 '+esc(rg)+' 기준 · ':''}검색어: ${esc(t.q||t.n+' 맛집')}</p>
   <div class="grid2"><a class="btn p" target="_blank" rel="noopener" href="https://map.naver.com/p/search/${encodeURIComponent((rg?rg+' ':'')+(t.q||t.n+' 맛집'))}">네이버 지도</a><a class="btn" target="_blank" rel="noopener" href="https://map.kakao.com/?q=${encodeURIComponent((rg?rg+' ':'')+(t.q||t.n+' 맛집'))}">카카오맵</a></div>
   <h3 style="margin:14px 0 4px">내 목록에서 이 테마 <span class="muted">${mine.length}곳</span></h3>${mine.map(x=>`<div class="drow"><b>${esc(x.이름)}</b><span style="flex:0 0 auto">${esc(x.지역||'')}</span></div>`).join('')||'<p class="muted">맛집 추가 시 테마에 “'+esc(t.n)+'”를 넣으면 여기 모여요.</p>'}
   <div class="row" style="margin-top:12px"><button id="tEdit">수정·삭제</button><button id="tAdd">＋ 이 테마로 맛집 추가</button><span style="flex:1"></span><button class="p" id="tClose">닫기</button></div></div>`;
  dl.showModal();$('#tClose').onclick=()=>{dl.returnValue='';dl.close()};
  $('#tEdit').onclick=()=>{dl.returnValue='';dl.close();setTimeout(()=>ACT.addTheme({},i),0)};
  $('#tAdd').onclick=()=>{dl.returnValue='';dl.close();setTimeout(()=>form('맛집',{테마:t.n}),0)}};
ACT.pick=()=>{const L=DB.맛집;if(!L.length)return toast('먼저 맛집을 추가해 주세요');const x=L[Math.floor(Math.random()*L.length)];$('#pickOut').innerHTML=`<div class="item"><div class="b"><div class="t">🍽 ${esc(x.이름)}</div><div class="d">${esc([x.지역,x.메뉴].filter(Boolean).join(' · '))}</div></div><a class="btn s" target="_blank" href="https://map.naver.com/p/search/${encodeURIComponent((x.지역||'')+' '+x.이름)}">지도</a></div>`};
ACT.swap=()=>{const a=$('#from').value;$('#from').value=$('#to').value;$('#to').value=a};
ACT.toHere=d=>{$('#to').value=d.a;$('#to').scrollIntoView({behavior:'smooth',block:'center'})};
ACT.route=d=>{const f=$('#from').value.trim(),t=$('#to').value.trim();if(!t)return toast('도착지를 입력해 주세요');let u;
  if(d.m==='google')u='https://www.google.com/maps/dir/?api=1&travelmode=transit&destination='+encodeURIComponent(t)+(f?'&origin='+encodeURIComponent(f):'');
  else if(d.m==='kakao')u='https://map.kakao.com/?'+(f?'sName='+encodeURIComponent(f)+'&':'')+'eName='+encodeURIComponent(t);
  else u='https://map.naver.com/p/search/'+encodeURIComponent(t);
  window.open(u,'_blank')};
ACT.pasteUrl=async()=>{let t='';try{t=(await navigator.clipboard.readText()||'').trim()}catch(e){}
  const m=t.match(/https:\/\/script\.google(?:usercontent)?\.com\/[^\s"'<>]+/);
  if(!m){toast('복사된 주소가 없어요. 아래 칸을 길게 눌러 직접 붙여넣고 [연결 테스트 & 저장]을 눌러 주세요',4500);$('#surl').focus();return}
  $('#surl').value=m[0];ACT.connect()};
ACT.connect=async()=>{const u=$('#surl').value.trim().replace(/\s+/g,'');if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(u))return toast('script.google.com 으로 시작하는 웹 앱 URL을 넣어 주세요',3500);
  const old=CFG.url;CFG.url=u;toast('연결 확인 중…');
  try{const r=await api('ping',{},30000);setCfg({hasAI:!!r.hasAI,sheetUrl:r.sheetUrl||''});toast('✅ 연결 성공! 데이터를 동기화합니다');
    const local=Object.keys(SHEETS).some(k=>DB[k].length);if(local&&!Q.length&&confirm('이 기기에 있던 기존 데이터를 시트로 올릴까요?'))for(const k in SHEETS)DB[k].forEach(r=>Q.push({action:'upsert',sheet:k,row:r}));
    saveLocal();await sync(true);render()}
  catch(e){CFG.url=old;toast('연결 실패: '+e.message+' — 배포 설정(액세스: 모든 사용자)을 확인하세요',5000)}};
ACT.copyCode=async()=>{try{const t=await (await fetch('Code.gs',{cache:'no-store'})).text();await navigator.clipboard.writeText(t);toast('서버 코드를 복사했어요. Apps Script에 붙여넣으세요!')}catch(e){window.open('Code.gs','_blank')}};
ACT.saveKcal=()=>{setCfg({kcal:$('#kc').value.trim()});toast('저장했어요')};
ACT.login=()=>CLOUD.login();ACT.logout=()=>CLOUD.logout();ACT.cloudPull=()=>CLOUD.pull();
ACT.install=async()=>{if(!window.__bip)return;window.__bip.prompt();try{await window.__bip.userChoice}catch(e){}window.__bip=null;render()};
ACT.exp=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}));a.download='나의하루_백업_'+today()+'.json';a.click()};

ACT.msort=d=>{sub.ms=d.v;render()};
ACT.detail=d=>{const x=DB.맛집.find(r=>r.id===d.id);if(!x)return;const dl=$('#dlg');
  const rows=[['업체명',x.이름],['지역',x.지역],['추천 메뉴',x.메뉴],['테마',x.테마],['평점',x.평점],['가격대',x.가격대],['방문',x.방문],['메모',x.메모]].filter(r=>r[1]);
  dl.innerHTML=`<div class="dhead"><img src="img/rest-store.svg" alt=""><h3>${esc(x.이름)}</h3></div><div style="padding:6px 18px 4px">${rows.map(([k,v])=>`<div class="drow"><span>${k}</span><b style="white-space:pre-wrap">${esc(v)}</b></div>`).join('')}</div><div class="row" style="padding:12px 18px 18px"><a class="btn" target="_blank" rel="noopener" href="https://map.naver.com/p/search/${encodeURIComponent((x.지역||'')+' '+x.이름)}">지도</a><span style="flex:1"></span><button id="dClose">닫기</button><button class="p" id="dEdit">수정</button></div>`;
  dl.showModal();
  $('#dClose').onclick=()=>{dl.returnValue='';dl.close()};
  $('#dEdit').onclick=()=>{dl.returnValue='';dl.close();setTimeout(()=>form('맛집',x),0)};
};
ACT.tv=()=>{const dl=$('#dlg');const S=['테이스티로드','식신로드','수요미식회','생생정보통','VJ특공대','생활의달인','맛있는TV','올리브쇼'];
  dl.innerHTML=`<div style="padding:18px"><h3>TV맛집</h3><p class="muted" style="margin:0 0 6px">TV에 나온 맛집을 방송 프로그램별로 지도에서 검색해요.</p>${S.map(n=>`<a class="drow" target="_blank" rel="noopener" href="https://map.naver.com/p/search/${encodeURIComponent(n+' 맛집')}" style="text-decoration:none;color:var(--ink)"><span style="color:var(--ink)">${n}</span><b style="flex:0">›</b></a>`).join('')}<div class="row" style="margin-top:12px"><span style="flex:1"></span><button class="p" id="tvClose">닫기</button></div></div>`;
  dl.showModal();$('#tvClose').onclick=()=>{dl.returnValue='';dl.close()}};

/* ===================== 시작 ===================== */
if(!TABS.some(x=>x[0]===tab))tab='home';
render();sync(true);CLOUD.init();
addEventListener('online',()=>sync(false));
addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__bip=e;if(tab==='home'||tab==='more')render()});
addEventListener('appinstalled',()=>{window.__bip=null;toast('앱이 설치됐어요! 홈 화면에서 열어 보세요');render()});
let lastVis=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(CFG.url)sync(true);else if(CLOUD.user&&Date.now()-lastVis>30000){lastVis=Date.now();CLOUD.pull()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
