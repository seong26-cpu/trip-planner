<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>코스 영상 가이드</title>
<style>
:root{--bg:#EAF6FB;--fg:#10304A;--muted:#4F6B80;--accent:#0E86B8;--line:#CBE3EE;--card:#fff;--yt:#D62B2B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;line-height:1.55}
main{max-width:860px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:1.35rem;margin:6px 0 2px}h2{font-size:1.05rem;margin:0}
.muted{color:var(--muted);font-size:.86rem}
a.back{color:var(--accent);font-weight:700;text-decoration:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button,a.btn{font:inherit;font-size:.88rem;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--fg);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
a.btn.yt{background:var(--yt);border-color:var(--yt);color:#fff;font-weight:700}
.stop{background:var(--card);border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 10px 26px -20px rgba(14,134,184,.6)}
.stop .hd{display:flex;gap:10px;align-items:baseline}
.stop .tm{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;flex:none}
.stop .nt{font-size:.85rem;color:var(--muted);margin:4px 0 8px}
.tag{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:99px;background:#FFE7A3;color:#5a4300}
.vid{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.vid:first-of-type{border-top:0}
.vid img{width:150px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#d8ebf3;display:block}
.vid b{font-size:.92rem;display:block;overflow-wrap:anywhere}
.vid p{margin:2px 0 6px;font-size:.84rem}
.vid .ch{font-size:.76rem;color:var(--muted)}
.vid .acts{display:flex;gap:6px;flex-wrap:wrap}
.vid .acts button,.vid .acts a{padding:6px 10px;font-size:.8rem}
.embed{grid-column:1/-1}.embed iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}
.more{margin-top:8px}
@media (max-width:520px){.vid{grid-template-columns:110px minmax(0,1fr)}.vid img{width:110px}}
</style>
</head>
<body>
<main>
  <a class="back" href="./">← 여행 플래너로</a>
  <h1 id="ttl">코스 영상 가이드</h1>
  <p class="muted">일정의 장소마다 <b>실제로 그 길을 찍은 유튜브 영상</b>을 골라 짧은 설명과 함께 보여줘요. 썸네일이나 "▶ 여기서 보기"를 누르면 이 화면에서 바로 재생돼요.</p>
  <div class="row"><select id="day" aria-label="날짜"></select><span class="muted" id="sum"></span></div>
  <div id="list"></div>
  <div class="stop"><h2>알아두기</h2><p class="muted">· 영상 설명은 영상 제목·내용 소개 기준이에요. 촬영 시기가 달라 가게·요금·공사 상황이 지금과 다를 수 있어요.<br>· 영상은 각 제작자의 것이며 유튜브에서 재생돼요. 영상이 삭제되면 "유튜브에서 더 찾기"를 눌러 주세요.<br>· 요금·시간은 일정 메모(직접 확인한 값)를 기준으로 하세요.</p></div>
</main>
<script>
(()=>{"use strict";
const $=s=>document.querySelector(s);const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let ST={};try{ST=JSON.parse(localStorage.getItem("trip-planner-v1")||"{}")}catch(_){}
const T=ST.trip||{},ITEMS=Array.isArray(ST.items)?ST.items:[];
const WD=["일","월","화","수","목","금","토"];const parseD=s=>{const [y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)};
const dayLabel=s=>{const d=parseD(s);return (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")"};
const days=[...new Set(ITEMS.map(i=>i.day).filter(Boolean))].sort();
const qd=new URLSearchParams(location.search).get("day");let DAY=days.includes(qd)?qd:days[0];

/* ===== 장소별 유튜브 영상 (2026-10-25 유튜브 검색으로 확인한 실제 영상) =====
   [정규식(일정 이름), 유튜브 검색어, [영상ID, 영상 제목, 한 줄 설명]...] */
const V=(id,t,d)=>({id,t,d});
const VID=[
 {re:/나리타.*(제1|T1)|成田/,q:"Narita Airport Terminal 1 arrival to train station",v:[
   V("6YZwVlUF0-k","How to Buy a Suica Card at Narita Airport (Step-by-Step)","나리타공항에서 Suica 카드를 사는 과정을 단계별로 보여줘요. 도착 후 역 쪽으로 가는 길도 참고하기 좋아요."),
   V("ocgl2MiXkx8","How to Buy A Welcome Suica Card at Narita Airport Tokyo","여행자용 Welcome Suica 구입 장면. JR 여행서비스센터 창구·발매기 모습을 미리 볼 수 있어요.")]},
 {re:/게이세이.*액세스|アクセス特急/,q:"Narita Airport to Asakusa Keisei Access Express",v:[
   V("J0LJJg_FzJo","How to Get from Narita Airport to Asakusa by Access Express (Step-by-Step Guide)","나리타공항 → 아사쿠사를 액세스 특급으로 가는 전 과정. 개찰구·승강장·행선지 확인 방법까지 일정과 같은 코스예요."),
   V("iHsuZx2a5RY","How to Go: Narita Airport to Asakusa by Keisei Narita Skyaccess using Welcome Suica Card","Welcome Suica로 게이세이 개찰구를 통과해 아사쿠사까지 가는 영상. 승환님 일정(실물 Suica 구입 → 액세스 특급)과 거의 같아요."),
   V("fMbACHQ6_Hc","Tokyo's SECRET Airport Express Train: The Keisei Access Express","액세스 특급이 어떤 열차인지(요금·좌석·장점) 소개. 지정석 없는 일반 객차 분위기를 볼 수 있어요.")]},
 {re:/맡기|코인로커/,q:"Asakusa station luggage storage coin locker",v:[]},
 {re:/아사쿠사\s*→\s*시바마타|타카사고|다카사고/,q:"Keisei Takasago station transfer Kanamachi line Shibamata",v:[
   V("rjSOwmwlPZE","Shibamata, Taisyakuten Temple, Yagiri no Watashi","시바마타역 → 다이샤쿠텐 → 야기리노와타시까지 이 날 오후 코스를 한 번에 훑어보는 영상이에요.")]},
 {re:/참배길|구사당고|당고/,q:"柴又 参道 草だんご 高木屋",v:[
   V("KXQERsbsfL8","Tokyo’s Hidden Old Town 🇯🇵 Walking in Shibamata","시바마타역에서 참배길을 따라 걷는 영상. 쇼와 시대 분위기의 가게 거리 느낌을 미리 볼 수 있어요."),
   V("I1kD6kZA3-E","高木屋老舗 東京下町散歩 柴又帝釈天／寅さんも愛した草だんご（일본어）","일정에 있는 '다카기야 노포'의 구사당고(쑥 경단) 소개 영상. 가게 안과 경단 모양을 볼 수 있어요."),
   V("78R1SwZoXtQ","【Shibamata／Tokyo】A town designated as a Nationally Important Cultural Landscape｜Japan Travel Guide","시바마타 여행 가이드. 참배길·다이샤쿠텐·주변 명소를 설명과 함께 소개해요.")]},
 {re:/다이샤쿠텐|帝釈天|제경사/,q:"Shibamata Taishakuten temple carvings garden",v:[
   V("8Js_z47Ofmk","Taishakuten Temple and Suikeien Garden (Shibamata, Tokyo)","다이샤쿠텐 경내와 유료(400엔) 정원 '스이케이엔'을 보여줘요. 조각 갤러리·정원을 볼지 정할 때 참고하세요."),
   V("SbaRzkb_JX8","Tokyo Day to Night Walk in Shibamata, Japan • 4K HDR","시바마타를 낮부터 저녁까지 걷는 4K 영상. 다이샤쿠텐 주변과 해 질 녘 분위기를 볼 수 있어요.")]},
 {re:/야마모토테이|山本亭/,q:"Yamamoto-tei Shibamata garden",v:[
   V("E-uA7d0Nonw","柴又公園「山本亭」[4K] \"Yamamoto-tei\" in Shibamata Park","야마모토테이 내부와 일본식 정원을 4K로 천천히 보여줘요. 다다미 방에서 정원을 바라보는 느낌 그대로예요."),
   V("BdM6HRXES1E","葛飾柴又「山本亭」Yamamoto-tei residence and garden in Shibamata","저택 건물과 정원 소개 영상이에요.")]},
 {re:/야기리|矢切/,q:"矢切の渡し 乗船",v:[
   V("18MJBIW-CKc","江戸川で唯一現存する渡し船「矢切の渡し」に乗ってみる（2023年3月下旬）（일본어）","에도가와에 하나 남은 나룻배 '야기리노와타시'를 실제로 타 보는 영상. 타는 곳·배 안·강 풍경을 볼 수 있어요."),
   V("DDqYK6bMPO8","【矢切の渡し】Nostalgic Yagiri no Watashi","나룻배의 옛 정취를 담은 짧은 소개 영상이에요.")]},
 {re:/시바마타\s*→\s*아사쿠사/,q:"Shibamata to Asakusa train",v:[]},
 {re:/가미나리몬|나카미세|센소지|雷門|浅草寺/,q:"Asakusa Kaminarimon Nakamise Sensoji evening walk",v:[
   V("6aLocq0F0FU","MUST VISIT Kaminarimon Gate Which Opens to Nakamise Street in ASAKUSA!","가미나리몬에서 나카미세 거리로 들어가는 길을 보여줘요. 큰 붉은 등불 앞 사진 위치를 미리 볼 수 있어요."),
   V("vJnpdqx-9xI","Tokyo Asakusa Evening & Night Walk 浅草","해 질 녘부터 밤까지 아사쿠사를 걷는 영상. 일정(17:15, 일몰 무렵)과 같은 시간대 분위기예요."),
   V("LfiJSdEewPo","[4K] NIGHT WALK in ASAKUSA 💛 Senso-ji Temple, Nakamise-dori St, Tokyo Sky Tree","조명이 켜진 센소지·나카미세·스카이트리 야경을 4K로 보여줘요.")]},
 {re:/돈키호테|ドン・キホーテ/,q:"Don Quijote Asakusa",v:[
   V("XDJf0MZE9hM","Inside Don Quijote Asakusa, Japan (quick walk-through/tour)","아사쿠사 돈키호테 매장 안을 빠르게 둘러보는 영상. ※ 승환님이 가실 '에키미세점(2026년 6월 개점)'이 아닌 다른 아사쿠사 지점일 수 있어요. 매장 분위기만 참고하세요.")]},
 {re:/저녁|라멘|덮밥/,q:"Asakusa dinner ramen local restaurant",v:[
   V("5R6Y2lsROsU","Street Food Tour in Asakusa, Japan (Nakamise Dori, Hoppy Dori, Denboin Dori)/浅草の食べ歩き","나카미세·홋피 거리·덴보인 거리의 먹거리를 차례로 맛보는 영상. 저녁 메뉴 고를 때 참고하세요.")]},
 {re:/사기노미야|鷺ノ宮|짐 찾기/,q:"Saginomiya station Seibu Shinjuku line",v:[
   V("l-zTNK-tv1c","⁴ᴷ Tokyo: Saginomiya Station (鷺ノ宮駅) - Japan Walking Tour (March, 2023)","숙소가 있는 사기노미야역 주변을 걷는 4K 영상. 밤에 캐리어 끌고 갈 길을 미리 익혀 두기 좋아요."),
   V("3kUKHsFk8vM","Seibu Shinjuku Line ● 西武新宿線","마지막으로 갈아탈 세이부신주쿠선 열차·역 모습을 볼 수 있어요.")]},
];
/* 일정에 없던 근처 먹거리·명소 (해당 지역 일정이 있으면 표시) */
const EXTRA=[
 {area:/아사쿠사|가미나리몬|센소지/,title:"닌교야키 (기무라야 본점)",note:"아사쿠사에서 가장 오래된 닌교야키(인형 모양 카스텔라) 가게 · 센소지 옆",q:"木村家 人形焼 浅草",v:[V("pE7IVEfpSrs","Japanese Street Food - Kimura Ningyo Yaki - Asakusa Tokyo","기무라야 본점에서 닌교야키를 굽는 모습. 가게 위치와 맛보는 장면이 나와요.")]},
 {area:/아사쿠사|가미나리몬|센소지/,title:"아사쿠사 문화관광센터 8층 전망대",note:"가미나리몬 맞은편 · 무료 · 9:00~22:00 · 나카미세와 스카이트리 야경",q:"Asakusa Culture Tourist Information Center observation deck",v:[V("vICTepds9qc","Beautiful Asakusa View for Free at Asakusa Culture Tourist Information Center","무료 전망대에서 내려다본 나카미세와 스카이트리 풍경을 보여줘요."),V("AzJjZNotdd0","Tokyo, Japan - Asakusa Culture Tourist Information Center Observation Deck","전망대로 올라가는 길과 테라스 모습이에요.")]},
 {area:/저녁|아사쿠사/,title:"홋피 거리 (이자카야 골목)",note:"모츠니(곱창 조림)와 홋피 음료로 유명한 골목 · 저녁 장소 후보",q:"Hoppy Street Asakusa",v:[V("EGxMBab0Pzc","Tokyo Walk - Hoppy Street in Asakusa (浅草 ホッピー通り)","홋피 거리를 걸으며 가게들과 분위기를 보여줘요."),V("Y-e9CG0m6js","[4K] Asakusa at Night: Tokyo's Silent Temple Turns Into Retro Drinking Alleys","조용해진 밤의 센소지와 레트로 술집 골목을 4K로 걷는 영상이에요.")]},
 {area:/시바마타|柴又/,title:"시바마타 해 질 녘 산책",note:"참배길·다이샤쿠텐 주변의 저녁 분위기",q:"Shibamata evening walk",v:[V("ViGuawqpoyI","Evening walk in Tokyo , Shibamata - Japan (Relaxing Music) 4K","시바마타의 저녁 산책 영상. 조용한 옛 동네 분위기를 느낄 수 있어요.")]},
];
const ytS=q=>"https://www.youtube.com/results?search_query="+encodeURIComponent(q);
function vidHTML(v,key){return `<div class="vid" id="v-${key}"><a href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" data-play="${v.id}" data-key="${key}" aria-label="${esc(v.t)} 재생"><img src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="" loading="lazy"></a>
  <div><b>${esc(v.t)}</b><p>${esc(v.d)}</p><div class="acts"><button data-play="${v.id}" data-key="${key}">▶ 여기서 보기</button><a class="btn" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">유튜브 앱으로</a></div></div></div>`}
const short=s=>{s=String(s||"").replace(/\((?:[^()]*(?:LIVE JAPAN|GO TOKYO|에키탄|tripmate|루루부|GOOD LUCK TRIP|사용자)[^()]*)\)/g,"").replace(/\s+/g," ").trim();return s.length>110?s.slice(0,108)+"…":s};
function render(){
  const list=ITEMS.filter(i=>i.day===DAY).sort((a,b)=>(a.time||"99:99").localeCompare(b.time||"99:99")||(a.createdAt||0)-(b.createdAt||0));
  $("#ttl").textContent=`${T.city||T.cityEn||"여행"} ${dayLabel(DAY)} 코스 영상 가이드`;
  let n=0,html="";const shown=new Set(),usedX=new Set();
  list.forEach((it,i)=>{const hit=VID.find(x=>x.re.test(it.title))||VID.find(x=>x.re.test(it.note||""));
    const vs=hit?hit.v.filter(v=>!shown.has(v.id)):[];vs.forEach(v=>shown.add(v.id));n+=vs.length;
    const q=hit?hit.q:`${it.title} ${T.cityEn||T.city||""}`;
    html+=`<section class="stop"><div class="hd"><span class="tm">${esc(it.time||"--:--")}</span><h2>${esc(it.title)}</h2></div>${it.note?`<p class="nt">${esc(short(it.note))}</p>`:""}
      ${vs.map((v,k)=>vidHTML(v,i+"-"+k)).join("")||`<p class="muted">이 구간을 딱 맞게 담은 영상은 찾지 못했어요. 아래 검색으로 비슷한 영상을 볼 수 있어요.</p>`}
      <div class="more"><a class="btn yt" href="${ytS(q)}" target="_blank" rel="noopener">🔎 유튜브에서 더 찾기</a></div></section>`;
    const txt=it.title+" "+(it.note||"");EXTRA.forEach((e,j)=>{if(usedX.has(j)||!e.area.test(txt)||!/명소|맛집|쇼핑/.test(it.kind||""))return;usedX.add(j);n+=e.v.length;
      html+=`<section class="stop"><div class="hd"><span class="tag">추가 추천</span><h2>${esc(e.title)}</h2></div><p class="nt">${esc(e.note)}</p>${e.v.map((v,k)=>vidHTML(v,"x"+j+"-"+k)).join("")}<div class="more"><a class="btn yt" href="${ytS(e.q)}" target="_blank" rel="noopener">🔎 유튜브에서 더 찾기</a></div></section>`})});
  $("#list").innerHTML=html||`<div class="stop"><p>이 날 일정이 없어요.</p></div>`;
  $("#sum").textContent=list.length?`장소 ${list.length}곳 · 추천 영상 ${n}개`:"";}
document.addEventListener("click",e=>{const b=e.target.closest("[data-play]");if(!b)return;e.preventDefault();const box=document.getElementById("v-"+b.dataset.key);if(!box)return;
  const ex=box.querySelector(".embed");if(ex){ex.remove();return}document.querySelectorAll(".embed").forEach(x=>x.remove());
  const d=document.createElement("div");d.className="embed";d.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${b.dataset.play}?autoplay=1&playsinline=1&rel=0" title="유튜브 영상" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;box.appendChild(d);d.scrollIntoView({behavior:"smooth",block:"center"})});
$("#day").innerHTML=days.map(d=>`<option value="${d}" ${d===DAY?"selected":""}>${dayLabel(d)}</option>`).join("");
$("#day").onchange=e=>{DAY=e.target.value;history.replaceState(null,"","?day="+DAY);render()};
if(!days.length){$("#list").innerHTML=`<div class="stop"><p>일정이 없어요. 여행 플래너에서 일정을 먼저 넣어 주세요(같은 브라우저에서 열어야 해요).</p></div>`;return}
render();
})();
</script>
</body>
</html>
